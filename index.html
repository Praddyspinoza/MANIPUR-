69,"editionAdded":"Obsidian"},{"id":"S170","date":"2026-10-11","publisher":"Northeast Live","title":"Kuki-Zo women appeal for peace at a Gorkha farmer's condolence service","url":"https://northeastlivetv.com/around-ne/manipur/let-the-cry-for-peace-be-louder-than-roar-of-violence-kuki-zo-womens-powerful-appeal-amid-cotu-shutdown/","category":"Regional reporting","topic":"Return & reconciliation","summary":"Reports a Gamgiphai condolence programme and Boishi Sitlhou's appeal for civilian protection and justice. The funeral convoy was proceeding to Senapati.","note":"The report attributes an ambush allegation; this entry does not establish responsibility. Senapati is a funeral-destination link, not a claimed attack location.","districts":["Kangpokpi","Senapati"],"tags":["Civil society","Peace appeal","Gorkha community"],"review":"Article text reviewed","medium":"Article","primary":false,"language":"English","accessed":"2026-10-12","family":"S170","datePrecision":"day","number":170,"editionAdded":"Obsidian"},{"id":"S171","date":"2024-12-15","publisher":"The Indian Express","title":"Borobekra and Pherzawl: competing positions on relocation and return","url":"https://indianexpress.com/article/india/their-relief-camp-was-the-site-of-a-gruesome-attack-but-these-meiteis-say-theyll-stay-put-9725202/","category":"Investigative / field reporting","topic":"Return & reconciliation","summary":"Field reporting follows Meitei residents remaining at Borobekra and records ITAC demands alongside the district administration's position. ITAC represents Hmars in Jiribam and Pherzawl.","note":"The camp and November attack were in Jiribam. Pherzawl is a border and civil-society link, not a relocated attack site. Allegations remain attributed.","districts":["Jiribam","Pherzawl"],"tags":["Field reporting","Civil society","Return"],"review":"Article text reviewed","medium":"Article","primary":false,"language":"English","accessed":"2026-10-12","family":"S171","datePrecision":"day","number":171,"editionAdded":"Obsidian"},{"id":"S172","date":"2026-06-07","publisher":"The Times of India","title":"RTI reporting: 731 camp and prefabricated-housing deaths across nine districts","url":"https://timesofindia.indiatimes.com/city/guwahati/731-idps-die-in-manipur-camps-since-ethnic-violence-began/articleshow/131556542.cms","category":"National reporting","topic":"Displacement","summary":"Reports home-department RTI data: 731 deaths among displaced residents across nine districts. The article includes district figures and describes health and assistance needs.","note":"Not 731 conflict killings. Scope differs from the later court record covering eight districts; totals are not reconciled here. Publication updated 7 June.","districts":["Churachandpur","Bishnupur","Kangpokpi","Imphal West","Kakching","Imphal East","Jiribam","Thoubal","Tengnoupal"],"tags":["RTI","Health","Accountability"],"review":"Article text reviewed","medium":"Article","primary":false,"language":"English","accessed":"2026-10-12","family":"S172","datePrecision":"day","number":172,"editionAdded":"Obsidian"},{"id":"S173","date":"2023-06-29","publisher":"The Indian Express","title":"Mizoram officials and civil society seek support for displaced arrivals","url":"https://indianexpress.com/article/india/as-over-12000-cross-over-from-manipur-mizoram-says-need-some-help-8691451/","category":"Regional spillovers","topic":"Displacement","summary":"Interviews document resource strain, schooling and relief in Mizoram. The report records 12,162 arrivals at a stated June cutoff and includes Manipur's response on relief and return.","note":"Not a current total. Manipur arrivals are distinct from refugees from Myanmar. Funding and return positions are attributed to the officials interviewed.","districts":[],"tags":["Mizoram","Education","Civil society","Hosting"],"review":"Article text reviewed","medium":"Article","primary":false,"language":"English","accessed":"2026-10-12","family":"S173","datePrecision":"day","number":173,"editionAdded":"Obsidian"},{"id":"S174","date":"2023-06-12","publisher":"PTI / The Times of India","title":"Early relief briefing: banking operations and supply access","url":"https://timesofindia.indiatimes.com/city/imphal/over-50000-displaced-people-staying-in-349-relief-camps/articleshow/100926192.cms","category":"National reporting","topic":"Mobility & livelihoods","summary":"A reported government statement said 198 of 242 bank branches were operational and described essential supplies moving through NH-37.","note":"The operational snapshot concerns 11 June 2023. Not a present-day service measure or an independent estimate of economic loss.","districts":[],"tags":["Banking","Statistics","Government response"],"review":"Indexed extract","medium":"Article","primary":false,"language":"English","accessed":"2026-10-12","family":"S174","datePrecision":"day","number":174,"editionAdded":"Obsidian"},{"id":"S175","date":"2023-09-01","publisher":"The Economic Times","title":"Social welfare data: displaced children and identified counselling needs","url":"https://economictimes.indiatimes.com/news/india/manipur-violence-nearly-12694-displaced-children-living-in-relief-camps-across-the-state/articleshow/103290686.cms","category":"National reporting","topic":"Gender & protection","summary":"Reports state social-welfare data recording 12,694 children in camps and 100 identified as severely traumatised and needing professional counselling.","note":"Administrative figures at the reporting date, not a population mental-health prevalence survey. No assumption is made that the other children were unaffected.","districts":[],"tags":["Children","Health","Statistics"],"review":"Indexed extract","medium":"Article","primary":false,"language":"English","accessed":"2026-10-12","family":"S175","datePrecision":"day","number":175,"editionAdded":"Obsidian"},{"id":"S176","date":"2026-09-01","publisher":"The Times of India","title":"Video report: attacks on Liangmai Naga villages in Kangpokpi","url":"https://timesofindia.indiatimes.com/videos/news/manipur-violence-three-naga-villages-attacked-10-houses-torched-in-fresh-kangpokpi-clashes/amp_videoshow/133687485.cms","category":"Video & audio","topic":"Armed violence","summary":"The publisher describes attacks on three villages, arson and an injured resident, followed by a security operation.","note":"Attribution was unresolved in the description. Video not independently watched; the listing is not an additional incident count.","districts":["Kangpokpi"],"tags":["Naga-Kuki violence","Video"],"review":"Publisher description reviewed","medium":"Publisher video","primary":false,"language":"English","accessed":"2026-10-12","family":"S176","datePrecision":"day","number":176,"editionAdded":"Obsidian"}],"events":[{"id":"E01","date":"2023-03-27","endDate":null,"title":"ST-recommendation litigation","districts":[],"topic":"Land & identity","summary":"A High Court direction concerned consideration of a recommendation, not an award of Scheduled Tribe status.","response":"The relevant direction was deleted on review in February 2024.","uncertainty":"A legal trigger is not a complete explanation of the conflict.","sources":["S13","S14"],"kind":"Institutional milestone"},{"id":"E02","date":"2023-05-03","endDate":null,"title":"Outbreak and spread of large-scale violence","districts":["Churachandpur","Bishnupur","Imphal East","Imphal West"],"topic":"Armed violence","summary":"Violence followed the Tribal Solidarity March and spread across multiple localities.","response":"Security, relief and judicial interventions followed.","uncertainty":"This is a multi-district outbreak record, not a reconstruction of who initiated each clash.","sources":["S10","S42","S75"],"kind":"Incident"},{"id":"E03","date":"2023-05-04","endDate":null,"title":"Assault on women near B. Phainom","districts":["Kangpokpi"],"topic":"Gender & protection","summary":"Survivor reporting and legal proceedings concern assaults on women during the early violence.","response":"The case became a focus of national outrage and judicial oversight.","uncertainty":"Survivors are not identified here. Police-station jurisdiction must not be mistaken for the incident district.","sources":["S74","S76","S10"],"kind":"Incident"},{"id":"E04","date":"2023-06-02","endDate":null,"title":"Reported attacks near Phayeng and Kangchup","districts":["Imphal West"],"topic":"Armed violence","summary":"Police accounts describe attacks and arson near Phayeng and Kangchup Chingkhong.","response":"FIRs and security measures were reported.","uncertainty":"Early police allegations are not findings of guilt; case counts and victim counts are different units.","sources":["S97"],"kind":"Incident"},{"id":"E05","date":"2023-06-13","endDate":null,"title":"Relief needs documented during field visits","districts":["Imphal East","Kangpokpi"],"topic":"Displacement","summary":"A humanitarian organisation describes displaced families and relief needs encountered during visits.","response":"Relief activities and coordination were described by the organisation.","uncertainty":"A programme account is not an independent coverage assessment of all camps.","sources":["S41"],"kind":"Humanitarian snapshot"},{"id":"E06","date":"2023-07-20","endDate":null,"title":"NCW complaint and response dispute","districts":[],"topic":"Accountability","summary":"Reporting questioned the response to an earlier complaint about violence against women.","response":"The NCW chief said the commission had written to state authorities three times.","uncertainty":"Whether those enclosures covered the particular assault remained unverified in the reporting.","sources":["S82","S83"],"kind":"Institutional milestone"},{"id":"E07","date":"2023-08-07","endDate":null,"title":"Supreme Court establishes oversight","districts":[],"topic":"Accountability","summary":"The Court created a former-judges committee and investigation oversight arrangements.","response":"Relief, rehabilitation and protection directions accompanied the investigation framework.","uncertainty":"Oversight orders are not final determinations of individual criminal liability.","sources":["S10"],"kind":"Institutional milestone"},{"id":"E08","date":"2023-08-29","endDate":null,"title":"Assembly adopts peace resolution","districts":[],"topic":"Governance","summary":"The Assembly bulletin records adoption of a resolution and disruption during a brief sitting.","response":"The government called for peace and dialogue.","uncertainty":"Procedural adoption does not establish that all disputed issues received a substantive debate.","sources":["S15"],"kind":"Institutional milestone"},{"id":"E09","date":"2023-09-08","endDate":null,"title":"Pallel gunfire and clashes","districts":["Kakching","Tengnoupal"],"topic":"Armed violence","summary":"AP reported two deaths and numerous injuries following clashes in the Pallel area.","response":"Security forces intervened; police described armed assailants.","uncertainty":"Pallel lies on a district interface. This record is associated with both districts, not counted twice as two incidents.","sources":["S64"],"kind":"Incident"},{"id":"E10","date":"2023-10-05","endDate":null,"title":"Attack on a human-rights defender's home","districts":["Imphal West"],"topic":"Accountability","summary":"Rights groups reported an attack on Babloo Loitongbam's home and continuing threats.","response":"Later joint appeals requested protection and accountability.","uncertainty":"The appeal does not establish the identity or guilt of each attacker.","sources":["S58","S57"],"kind":"Incident"},{"id":"E11","date":"2023-12-04","endDate":null,"title":"Thirteen bodies recovered near Leithao","districts":["Tengnoupal"],"topic":"Armed violence","summary":"Police confirmed the recovery of thirteen bodies; early reporting differed on the circumstances.","response":"The NHRC sought reports from state authorities.","uncertainty":"The DGP's account was narrower than headlines asserting a proven gunfight or fixed identities.","sources":["S87","S88","S89","S90"],"kind":"Incident"},{"id":"E12","date":"2024-01-17","endDate":null,"title":"Moreh deaths","districts":["Tengnoupal"],"topic":"Armed violence","summary":"Two security personnel killed.","response":"","uncertainty":"Attribution alleged.","sources":["S91"],"kind":"Incident"},{"id":"E13","date":"2024-02-21","endDate":null,"title":"High Court revises the ST-related order","districts":[],"topic":"Land & identity","summary":"The review removed paragraph 17(iii) from the March 2023 order.","response":"The operative direction, rather than the entire eligibility dispute, was deleted.","uncertainty":"Neither order granted ST status.","sources":["S13","S14"],"kind":"Institutional milestone"},{"id":"E14","date":"2024-06-06","endDate":"2024-06-13","title":"Jiribam escalation and subsequent arson","districts":["Jiribam"],"topic":"Armed violence","summary":"A farmer's death was followed by violence, displacement and attacks on property.","response":"Security-force reporting and an ITAC statement described later arson.","uncertainty":"Details of property damage were partially corroborated; allegations naming perpetrators remained disputed.","sources":["S99"],"kind":"Incident"},{"id":"E15","date":"2024-08-02","endDate":null,"title":"Lalpani arson after a peace meeting","districts":["Jiribam"],"topic":"Return & reconciliation","summary":"Renewed arson was reported after a meeting involving community representatives.","response":"A local peace agreement had been reached the previous day.","uncertainty":"A signed agreement is not evidence of universal support or effective protection on the ground.","sources":["S105"],"kind":"Incident"},{"id":"E16","date":"2024-09-01","endDate":null,"title":"Koutruk attack","districts":["Imphal West"],"topic":"Armed violence","summary":"Reporting documented deaths during an attack at Koutruk.","response":"Police described the use of drone-delivered explosives.","uncertainty":"The reported weapon assessment is attributed to police; the archive does not independently authenticate it.","sources":["S34"],"kind":"Incident"},{"id":"E17","date":"2024-09-06","endDate":null,"title":"Moirang attack","districts":["Bishnupur"],"topic":"Armed violence","summary":"A death and injuries were reported following an attack in Moirang.","response":"Police described a rocket attack.","uncertainty":"Weapon and perpetrator assessments require case-level verification.","sources":["S34"],"kind":"Incident"},{"id":"E18","date":"2024-09-07","endDate":null,"title":"Renewed Jiribam clashes","districts":["Jiribam"],"topic":"Armed violence","summary":"Human Rights Watch's account records further fatal clashes in Jiribam.","response":"The organisation called for civilian protection and accountability.","uncertainty":"This record is separate from the November escalation.","sources":["S34"],"kind":"Incident"},{"id":"E19","date":"2024-11-07","endDate":null,"title":"Woman killed in Zairawn","districts":["Jiribam"],"topic":"Gender & protection","summary":"A Hmar woman was killed during an attack on her home.","response":"Civil-society organisations condemned the killing; later arrests were reported.","uncertainty":"Security-inaction allegations are not established findings. Identifying and graphic details are omitted.","sources":["S104","S35","S98"],"kind":"Incident"},{"id":"E20","date":"2024-11-09","endDate":null,"title":"Woman killed in Bishnupur","districts":["Bishnupur"],"topic":"Gender & protection","summary":"Rights reporting records the killing of a Meitei woman during renewed violence.","response":"Calls for protection addressed threats to civilians across communities.","uncertainty":"This event is not combined with the separate Jiribam killings.","sources":["S35"],"kind":"Incident"},{"id":"E21","date":"2024-11-11","endDate":null,"title":"Ten killed in Jiribam encounter","districts":["Jiribam"],"topic":"Armed violence","summary":"AP reported ten deaths during a clash with security forces.","response":"Police described militants; the ITLF described village volunteers.","uncertainty":"Competing descriptions are retained; the archive does not adjudicate their status.","sources":["S63","S35"],"kind":"Incident"},{"id":"E22","date":"2024-11-11","endDate":"2024-11-16","title":"Abduction and killing of women and children","districts":["Jiribam"],"topic":"Gender & protection","summary":"Three women and three children were reported abducted and later found dead.","response":"The NIA investigation subsequently faced High Court scrutiny.","uncertainty":"The later hearing is reported by a newspaper; its original order is not included in this collection.","sources":["S35","S103"],"kind":"Incident"},{"id":"E23","date":"2024-11-16","endDate":null,"title":"Attacks on politicians' properties","districts":["Imphal East","Imphal West"],"topic":"Governance","summary":"Protests and attacks on political properties followed reports of civilian killings.","response":"Authorities imposed security restrictions.","uncertainty":"Multi-locality record. It must not be used to locate a particular unverified attack on the map.","sources":["S35"],"kind":"Incident"},{"id":"E24","date":"2024-12-23","endDate":null,"title":"Life in a Kangpokpi relief camp","districts":["Kangpokpi"],"topic":"Displacement","summary":"AP profiles a displaced family's living conditions and uncertainty about return.","response":"The account highlights unresolved needs in prolonged displacement.","uncertainty":"Publication date is used: this is a testimony snapshot, not a new violent incident.","sources":["S62"],"kind":"Humanitarian snapshot"},{"id":"E25","date":"2025-02-13","endDate":null,"title":"President's Rule and peace-policy debate","districts":[],"topic":"Governance","summary":"The change in governance brought renewed debate over security and reconciliation.","response":"Policy analysis proposed disarmament and credible dialogue.","uncertainty":"A change in constitutional administration does not itself establish reconciliation.","sources":["S56","S27"],"kind":"Institutional milestone"},{"id":"E26","date":"2025-03-08","endDate":null,"title":"Free-movement bus initiative challenged","districts":["Kangpokpi"],"topic":"Mobility & supplies","summary":"An attack on a bus and clashes were reported near Gamgiphai.","response":"Authorities sought to restore travel; community organisations opposed the initiative.","uncertainty":"The destination, Senapati, is not mapped as the attack site.","sources":["S102"],"kind":"Incident"},{"id":"E27","date":"2025-07-16","endDate":null,"title":"Displaced families stopped on return journey","districts":["Imphal East"],"topic":"Return & reconciliation","summary":"Residents leaving Sajiwa for Doilaithabi were stopped by police.","response":"Police described a precautionary restriction.","uncertainty":"The report documents a disputed restriction, not an independent assessment of route safety.","sources":["S101"],"kind":"Incident"},{"id":"E28","date":"2025-09-13","endDate":null,"title":"Prime Minister visits Churachandpur","districts":["Churachandpur"],"topic":"Return & reconciliation","summary":"The Prime Minister addressed peace, development and affected communities during the visit.","response":"Project announcements were made alongside the visit.","uncertainty":"Development announcements must not be relabelled as compensation or completed rehabilitation.","sources":["S30"],"kind":"Institutional milestone"},{"id":"E29","date":"2026-02-04","endDate":null,"title":"Elected government restored","districts":[],"topic":"Governance","summary":"A new elected government took office after President's Rule.","response":"The Governor's Address subsequently set out rehabilitation commitments.","uncertainty":"Targets in an address are not completion figures.","sources":["S01","S20"],"kind":"Institutional milestone"},{"id":"E30","date":"2026-03-12","endDate":null,"title":"Assembly discusses Thawai-area violence","districts":["Ukhrul"],"topic":"Armed violence","summary":"A member raised gunfire and abductions on the Imphal-Ukhrul route.","response":"Ministers described rescue coordination, deaths and investigation measures.","uncertainty":"This is the reporting date of a legislative discussion, not an independently established incident date. The bulletin has an internal date typo.","sources":["S19"],"kind":"Reported in legislature"},{"id":"E31","date":"2026-04-07","endDate":null,"title":"Children killed at Tronglaobi","districts":["Bishnupur"],"topic":"Gender & protection","summary":"An explosive attack killed two children and injured their mother.","response":"The probe was referred to the NIA; later arrests were reported.","uncertainty":"Early accounts differ on weapon details. Arrest does not establish guilt.","sources":["S92","S93","S94","S95"],"kind":"Incident"},{"id":"E32","date":"2026-05-13","endDate":null,"title":"Hostage crisis in a renewed conflict cycle","districts":[],"topic":"Gender & protection","summary":"Amnesty's June statement addresses hostage-taking and the renewed Naga-Kuki cycle.","response":"The organisation demanded release of hostages and protection of civilians.","uncertainty":"Specific incident locations are not inferred from a statewide statement.","sources":["S38"],"kind":"Reported incident cluster"},{"id":"E33","date":"2026-09-13","endDate":null,"title":"Fatal attacks near Longpi and Tollen","districts":["Tamenglong"],"topic":"Armed violence","summary":"Four deaths in separate attacks were reported along the NH-37 corridor.","response":"Local organisations condemned the attacks and urged restraint.","uncertainty":"Perpetrator allegations remain attributed. These September deaths are later than the Assembly's August cutoff.","sources":["S106"],"kind":"Incident"},{"id":"E34","date":"2026-09-17","endDate":null,"title":"Court reviews cases and camp deaths","districts":[],"topic":"Accountability","summary":"The Supreme Court recorded investigation progress and sought fuller explanations of camp mortality.","response":"Further affidavits and legal-services involvement were directed.","uncertainty":"Deaths from all causes in camps are not the same measure as conflict killings.","sources":["S11"],"kind":"Institutional milestone"},{"id":"E35","date":"2026-10-09","endDate":"2026-10-10","title":"New hill-district escalation","districts":["Kamjong","Ukhrul","Kangpokpi"],"topic":"Armed violence","summary":"The latest reports describe nine deaths across a cluster of killings, arson and subsequent clashes.","response":"The Chief Minister appealed for peace and sought central support.","uncertainty":"One multi-district cluster, not nine deaths in each district. Naga-Kuki incidents are not automatically attributed to the 2023 Meitei-Kuki-Zo conflict.","sources":["S05","S06","S07"],"kind":"Incident"},{"id":"E36","date":"2023-05-12","endDate":null,"title":"Tribal MLAs seek separate administration","districts":[],"topic":"Land & identity","summary":"Ten tribal MLAs called for a separate administration following the violence.","response":"The Chief Minister rejected division in subsequent public remarks.","uncertainty":"The demand included members of the ruling party. This was not a recorded Assembly floor exchange.","sources":["S114","S113"],"kind":"Institutional milestone"},{"id":"E37","date":"2026-08-31","endDate":null,"title":"Attack on N. Teikhang village","districts":["Kangpokpi"],"topic":"Armed violence","summary":"Three residents, including two women, were reported killed.","response":"Local civil-society organisations condemned the attack.","uncertainty":"Attribution remained alleged.","sources":["S116"],"kind":"Incident"},{"id":"E38","date":"2023-05-22","endDate":null,"title":"Senapati: a small relief camp and stranded supply trucks","districts":["Senapati"],"topic":"Displacement","summary":"A security briefing recorded 22 residents at one camp and 105 loaded trucks stranded in the district.","response":"Authorities described transport protection and wider deployment.","uncertainty":"Reported dated figures; no allegation of a killing in Senapati is inferred.","sources":["S118"],"kind":"Relief / logistics"},{"id":"E39","date":"2023-05-22","endDate":null,"title":"Pherzawl: curfew relaxation and participation in peace outreach","districts":["Pherzawl"],"topic":"Governance","summary":"The security briefing recorded daytime curfew relaxation and participation of the Pherzawl SP in a meeting with ITLF representatives in Churachandpur.","response":"Officials appealed for peaceful dialogue.","uncertainty":"The meeting venue was Churachandpur. This is Pherzawl-linked administrative response, not an attack inside Pherzawl.","sources":["S118"],"kind":"Administrative response"},{"id":"E40","date":"2023-06-23","endDate":null,"title":"Pherzawl: nodal officer assigned for relief coordination","districts":["Pherzawl"],"topic":"Governance","summary":"A state release assigned an officer to coordinate relief in a district group including Pherzawl.","response":"The release set out coordination arrangements.","uncertainty":"A responsibility assignment does not prove a camp operated in every assigned district.","sources":["S122"],"kind":"Administrative response"},{"id":"E41","date":"2023-06-02","endDate":null,"title":"Chandel: daytime curfew relaxation","districts":["Chandel"],"topic":"Governance","summary":"The district was listed among those with limited daytime curfew relaxation.","response":"Restrictions were adjusted in the reported security review.","uncertainty":"Administrative measure, not a district-wide incident or severity assessment.","sources":["S121"],"kind":"Administrative response"},{"id":"E42","date":"2025-05-17","endDate":null,"title":"Chandel: community leaders allege exclusion from relief recognition","districts":["Chandel","Kakching","Churachandpur"],"topic":"Displacement","summary":"A published investigation records allegations about burned hill villages, contested district jurisdiction and aid recognition.","response":"Community leaders sought recognition and independent investigation.","uncertainty":"Publication milestone. Village and household totals are attributed estimates; no separately obtained government reply in the article.","sources":["S119","S120"],"kind":"Published investigation"},{"id":"E43","date":"2025-07-22","endDate":null,"title":"Noney: reported internal armed-group clash","districts":["Noney"],"topic":"Armed violence","summary":"An unnamed official described five deaths in an internal CKMA leadership clash at Deiveijang.","response":"The report said a police team was heading to the remote site.","uncertainty":"Official attribution was reported, not a concluded judicial finding. Distinct from the Meitei-Kuki civilian confrontation.","sources":["S123"],"kind":"Armed-group incident"},{"id":"E44","date":"2023-08-17","endDate":null,"title":"Noney: landslides obstruct an essential supply route","districts":["Noney"],"topic":"Mobility & livelihoods","summary":"Goods vehicles were stranded on NH-37 after landslides.","response":"The report describes disrupted road access.","uncertainty":"Natural hazard compounding a conflict-constrained corridor, not conflict-inflicted road damage.","sources":["S124"],"kind":"Compounding hazard"},{"id":"E45","date":"2024-01-01","endDate":null,"title":"Lilong, Thoubal: civilian shooting and subsequent SIT","districts":["Thoubal"],"topic":"Accountability","summary":"A shooting killed civilians in Lilong; a later update reported five deaths.","response":"Police formed an SIT; the government and local leaders appealed against escalation.","uncertainty":"Early reports counted four deaths. Alleged motive and responsibility remain distinct from proven findings.","sources":["S125","S126"],"kind":"Civilian attack / investigation"},{"id":"E46","date":"2023-05-10","endDate":null,"title":"Thoubal workers evacuated to Nagaland","districts":["Thoubal"],"topic":"Mobility & livelihoods","summary":"A reported defence statement describes evacuation of 47 Konyak women workers during the second phase to Nagaland.","response":"Assam Rifles and the Nagaland government coordinated the operation.","uncertainty":"Evacuation does not establish that each person had suffered a physical attack.","sources":["S127","S134"],"kind":"Evacuation"},{"id":"E47","date":"2024-06-10","endDate":null,"title":"Jiribam escalation: displacement into Assam","districts":["Jiribam"],"topic":"Displacement","summary":"Cachar police reported around 600 arrivals from Jiribam, mainly hosted by relatives.","response":"Assam authorities increased border vigilance and assistance.","uncertainty":"A date-specific estimate, not the current displaced population.","sources":["S128","S129"],"kind":"Cross-state displacement"},{"id":"E48","date":"2023-12-20","endDate":null,"title":"Churachandpur: mass funeral and grieving families","districts":["Churachandpur"],"topic":"Protection","summary":"Le Monde\u2019s later field report describes the mass funeral at Sehken.","response":"The report discusses the return of bodies and family mourning.","uncertainty":"Funeral date differs from both date of death and article publication. No new fatality total is added.","sources":["S141"],"kind":"Human consequences"},{"id":"E49","date":"2025-04-11","endDate":null,"title":"Fact-check questions a parliamentary no-violence assertion","districts":[],"topic":"Accountability","summary":"WebQoof publishes a comparison of Shah\u2019s statement with reported deaths.","response":"The article presents contrary reporting and the quoted statement.","uncertainty":"Published verification, not a court ruling or new incident.","sources":["S163"],"kind":"Published fact-check"},{"id":"E50","date":"2026-10-11","endDate":null,"title":"Gamgiphai: solidarity, mourning and a peace appeal","districts":["Kangpokpi","Senapati"],"topic":"Return & reconciliation","summary":"A report describes Kuki-Zo women paying respects to a Gorkha farmer and calling for civilian protection.","response":"Boishi Sitlhou appealed for justice and peace. The convoy continued to Senapati.","uncertainty":"Senapati is linked as the reported funeral destination. Alleged attack responsibility is not established by this record.","sources":["S170"],"kind":"Civil-society response"},{"id":"E51","date":"2024-12-15","endDate":null,"title":"Jiribam-Pherzawl border context: disagreement over camp relocation","districts":["Jiribam","Pherzawl"],"topic":"Return & reconciliation","summary":"A field report records residents' intention to remain, an ITAC relocation demand and the district administration's security position.","response":"The report quotes officials describing enhanced protection; residents give their own reasons for staying.","uncertainty":"Dated to publication of the follow-up. The camp and earlier attack were in Jiribam; Pherzawl is linked through geography and civil society.","sources":["S171"],"kind":"Published field follow-up"}],"claims":[{"id":"C01","forum":"Assembly","date":"2023-08-29","title":"What did the peace resolution establish?","speakerA":"Government resolution","positionA":"Called for peace and dialogue.","speakerB":"Assembly bulletin","positionB":"Also records disruption and adjournment.","relationship":"Procedural counterpoint","note":"Adoption is documented; a substantive all-party debate cannot be inferred.","sourcesA":["S15"],"sourcesB":["S15"]},{"id":"C02","forum":"Assembly","date":"2024-02-29","title":"Suspension of Operations: request versus later policy","speakerA":"Assembly","positionA":"Urged the Union to abrogate the SoO pacts.","speakerB":"Union policy, reported in 2025","positionB":"Subsequent renewal retained conditions on territorial integrity and camps.","relationship":"Later policy context","note":"Not a same-sitting reply. A state resolution cannot itself terminate the pact; see S115 on the reported 2026 expiry. Current official status remains to be checked.","sourcesA":["S16","S17"],"sourcesB":["S32","S115"]},{"id":"C03","forum":"Assembly","date":"2024-08-08","title":"Security for schools","speakerA":"Th. Lokeshwar Singh","positionA":"Raised extortion and school-security concerns.","speakerB":"Education Minister Th. Basanta Kumar","positionB":"Described patrols and contact with police.","relationship":"Direct recorded response","note":"A stated measure is not an independently measured reduction in risk.","sourcesA":["S18"],"sourcesB":["S18"]},{"id":"C04","forum":"Assembly","date":"2024-08-08","title":"Housing and return","speakerA":"Opposition members","positionA":"Questioned displacement, property loss and the rehabilitation roadmap.","speakerB":"Chief Minister N. Biren Singh","positionB":"Cited housing instalments and rehabilitation of 135 Jiribam families.","relationship":"Direct recorded response","note":"Administrative claims need beneficiary-level and safe-return verification.","sourcesA":["S18"],"sourcesB":["S18"]},{"id":"C05","forum":"Assembly","date":"2024-08-08","title":"Competing explanations of the violence","speakerA":"K. Ranjit Singh","positionA":"Questioned root causes and the NRC narrative.","speakerB":"Chief Minister N. Biren Singh","positionB":"Raised immigration and new-village claims; said NRC was not implemented.","relationship":"Direct recorded response","note":"These are positions, not findings that an entire community is undocumented.","sourcesA":["S18"],"sourcesB":["S18"]},{"id":"C06","forum":"Assembly","date":"2024-08-08","title":"AFSPA and the state's authority","speakerA":"Leishiyo Keishing","positionA":"Sought repeal in the hills.","speakerB":"Chief Minister N. Biren Singh","positionB":"Said the Centre would need to act.","relationship":"Direct recorded response","note":"Record the jurisdictional reply separately from the policy demand.","sourcesA":["S18"],"sourcesB":["S18"]},{"id":"C07","forum":"Assembly","date":"2026-03-12","title":"Thawai gunfire and abductions","speakerA":"K. Meghachandra Singh","positionA":"Raised insecurity on the Imphal-Ukhrul route.","speakerB":"Home Minister and Chief Minister","positionB":"Described rescue coordination, deaths and investigation steps.","relationship":"Direct recorded response","note":"Bulletin header is 12 March; an internal line says February. The date inconsistency is preserved in the source note.","sourcesA":["S19"],"sourcesB":["S19"]},{"id":"C08","forum":"Assembly","date":"2026-03-12","title":"Compensation for fallow farmland","speakerA":"K. Meghachandra Singh","positionA":"Asked about affected paddy fields around Moirang.","speakerB":"Chief Minister Khemchand Singh","positionB":"Said some compensation was paid and the remainder would follow.","relationship":"Direct recorded response","note":"A promise is not a completed disbursement.","sourcesA":["S19"],"sourcesB":["S19"]},{"id":"C09","forum":"Assembly","date":"2026-03-12","title":"Crop insurance payments","speakerA":"Th. Lokeshwar Singh","positionA":"Questioned crop-insurance relief.","speakerB":"Chief Minister Khemchand Singh","positionB":"Attributed the later-year delay to verification.","relationship":"Direct recorded response","note":"The bulletin does not independently establish every claim's payment status.","sourcesA":["S19"],"sourcesB":["S19"]},{"id":"C10","forum":"Assembly","date":"2026-03-12","title":"Displaced voters and electoral rolls","speakerA":"Th. Lokeshwar Singh","positionA":"Raised displaced voters' original-roll access.","speakerB":"Chief Minister Khemchand Singh","positionB":"Referred to consultation with election authorities.","relationship":"Direct recorded response","note":"No completed rights-restoration outcome is inferred.","sourcesA":["S19"],"sourcesB":["S19"]},{"id":"C11","forum":"Assembly","date":"2026-09-03","title":"Deaths and missing people","speakerA":"MLA Sapam Ranjan Singh","positionA":"Sought conflict casualty and missing-person information.","speakerB":"Home Minister Govindas Konthoujam","positionB":"Reported 306 deaths and 49 missing through 31 August 2026.","relationship":"Reported question and answer","note":"The questioner is not labelled opposition. This is a press report of the answer; the original transcript is not in the collection.","sourcesA":["S01"],"sourcesB":["S01","S02"]},{"id":"C12","forum":"Assembly","date":"2026-09-05","title":"Is there a credible rehabilitation roadmap?","speakerA":"Congress leader K. Meghachandra","positionA":"Criticised the absence of a concrete roadmap in press remarks.","speakerB":"Earlier government statement","positionB":"Reported 36,000 of 60,000 displaced people resettled.","relationship":"Different dates; no direct reply located","note":"These are contextual comparisons, not a fabricated floor exchange or proof of durable return.","sourcesA":["S04"],"sourcesB":["S03"]},{"id":"C13","forum":"Parliament","date":"2023-08-09","title":"Accountability in the no-confidence debate","speakerA":"Rahul Gandhi, Lok Sabha","positionA":"Criticised the handling of Manipur and the Prime Minister's absence from the state.","speakerB":"Amit Shah; Narendra Modi","positionB":"Shah defended the state response; the PM condemned violence and promised peace.","relationship":"Debate responses across 9-10 August","note":"Use the official reply alongside reported criticism. Expunged passages are not reproduced as final parliamentary text.","sourcesA":["S111","S22"],"sourcesB":["S23","S21"]},{"id":"C14","forum":"Parliament","date":"2023-08-09","title":"Historical comparisons in the debate","speakerA":"Opposition criticism","positionA":"Questioned present failures of protection and accountability.","speakerB":"Smriti Irani","positionB":"Invoked earlier violence under Congress governments.","relationship":"Political counterargument","note":"A historical comparison does not, by itself, rebut a current factual allegation about protection or relief.","sourcesA":["S112"],"sourcesB":["S112"]},{"id":"C15","forum":"Parliament","date":"2024-07-01","title":"Silence versus claims of normalisation","speakerA":"Bimol Akoijam, Lok Sabha","positionA":"Challenged silence and omission from the President's Address.","speakerB":"Prime Minister, Rajya Sabha, 3 July","positionB":"Described declining violence and efforts to restore normality.","relationship":"Later response context in a different House","note":"Do not present the speeches as a same-sitting exchange. Subsequent incidents are separately dated.","sourcesA":["S109","S110"],"sourcesB":["S24"]},{"id":"C16","forum":"Parliament","date":"2025-08-05","title":"Extension of President's Rule","speakerA":"Muzibulla Khan, BJD, Rajya Sabha","positionA":"Questioned the continuing failure to restore normal governance.","speakerB":"MoS Home Nityanand Rai","positionB":"Defended the extension and cited improved security.","relationship":"Reported debate response","note":"The minister's historical incident claim is not a current or independently reconciled violence count.","sourcesA":["S27"],"sourcesB":["S27"]},{"id":"C17","forum":"Parliament","date":"2025-12-11","title":"Housing for displaced people: answer specificity","speakerA":"Bimol Akoijam, Lok Sabha UQ 2060","positionA":"Sought details of housing and funds for displaced families.","speakerB":"MoS Housing Tokhan Sahu","positionB":"Provided PMAY-U eligibility and statewide programme figures.","relationship":"Direct written answer","note":"Statewide housing sanctions and completions are not an IDP-only beneficiary count; requested disaggregation remains a gap.","sourcesA":["S26"],"sourcesB":["S26"]},{"id":"C18","forum":"Parliament","date":"2026-03-27","title":"Mental-health needs: services versus prevalence","speakerA":"Bimol Akoijam, Lok Sabha UQ 5585","positionA":"Asked about conflict-related mental-health effects on women and children.","speakerB":"MoS Health Prataprao Jadhav","positionB":"Cited services and 1,040 team visits to camps through 10 March 2026.","relationship":"Direct written answer","note":"Team visits are not distinct patients or a prevalence estimate. The older national survey is not a post-conflict Manipur survey.","sourcesA":["S25"],"sourcesB":["S25"]},{"id":"C19","forum":"Public record","date":"2023-09-03","title":"Editors Guild report and regional press rebuttals","speakerA":"Editors Guild of India","positionA":"Raised concerns about media conduct and institutional bias.","speakerB":"AMWJU / EGM; Solidarity","positionB":"Disputed methodology, factual descriptions and inferences in formal responses.","relationship":"Documented rebuttals","note":"Read the report and both responses. A disputed report, denial or corrected caption must not be treated as the final finding on all allegations.","sourcesA":["S49"],"sourcesB":["S50","S51"]},{"id":"C20","forum":"Public record","date":"2023-07-21","title":"NCW: initial criticism and subsequent response","speakerA":"Newslaundry report","positionA":"Questioned action on a June complaint.","speakerB":"NCW chief Rekha Sharma","positionB":"Said three letters had gone to state authorities without a response.","relationship":"Documented response","note":"The reporting could not establish that the enclosures covered the particular assault. This limits any claim of exoneration.","sourcesA":["S82"],"sourcesB":["S83"]},{"id":"C21","forum":"Public record","date":"2023-09-04","title":"UN experts and India's response","speakerA":"UN special-procedure experts","positionA":"Raised concerns about violence, sexual assaults and minority protection.","speakerB":"India's response","positionB":"Called the communication misleading and premature, citing government action.","relationship":"Documented response","note":"Expert communications are not judgments by a UN court; the government's rejection does not itself disprove every allegation.","sourcesA":["S52"],"sourcesB":["S53"]},{"id":"C22","forum":"Public record","date":"2023-07-13","title":"European Parliament and India's response","speakerA":"European Parliament","positionA":"Adopted a resolution on rights and protection concerns.","speakerB":"Ministry of External Affairs","positionB":"Rejected what it described as interference in internal affairs.","relationship":"Documented response","note":"A political resolution is non-binding and not a judicial finding.","sourcesA":["S54"],"sourcesB":["S55"]},{"id":"C23","forum":"Public record","date":"2024-11-11","title":"Jiribam: disputed description of those killed","speakerA":"Police account","positionA":"Described ten people killed as militants.","speakerB":"ITLF account","positionB":"Described them as village volunteers.","relationship":"Competing accounts","note":"Neither description is accepted here as an adjudicated status.","sourcesA":["S63"],"sourcesB":["S63"]},{"id":"C24","forum":"Public record","date":"2025-07-16","title":"Return restrictions and safety","speakerA":"Displaced residents","positionA":"Attempted to travel back from Sajiwa towards their villages.","speakerB":"Police","positionB":"Said stopping them was precautionary.","relationship":"Documented explanation","note":"The source establishes the restriction and stated rationale, not an independent assessment of safe return.","sourcesA":["S101"],"sourcesB":["S101"]},{"id":"C25","forum":"Assembly","date":"2023-05-15","title":"Separate administration versus territorial integrity","speakerA":"Ten tribal MLAs","positionA":"Sought separate administration after the violence.","speakerB":"Chief Minister N. Biren Singh","positionB":"Rejected division, citing Manipur's territorial integrity.","relationship":"Public positions outside the House","note":"Includes ruling-party MLAs. It is not a government-opposition floor exchange; individual/community positions must not be conflated.","sourcesA":["S114"],"sourcesB":["S114"]},{"id":"C26","forum":"Assembly","date":"2023-08-25","title":"Were the Chief Minister and tribal MLAs in contact?","speakerA":"Reported Chief Minister statement","positionA":"Said he was in contact with the tribal MLAs.","speakerB":"Joint clarification by ten MLAs","positionB":"Denied contact since the outbreak and reiterated their demand.","relationship":"Documented public rebuttal","note":"This is a dispute over a factual claim in public statements, not a recorded Assembly sitting.","sourcesA":["S113"],"sourcesB":["S113"]},{"id":"C27","forum":"Parliament","date":"2025-04-03","title":"What was meant by no violence in four months?","speakerA":"Amit Shah / quoted parliamentary statement","positionA":"The fact-check reproduces his statement referring to December 2024 through March 2025.","speakerB":"The Quint / WebQoof, 11 April 2025","positionB":"Identifies reported deaths that it argues contradict an unqualified no-violence description.","relationship":"Later independent fact-check","note":"This is not a same-sitting opposition reply. A common incident definition is necessary before comparing the claims.","sourcesA":["S163"],"sourcesB":["S163"]}],"metrics":[{"id":"deaths","value":"306","label":"Deaths reported to Assembly","asof":"31 Aug 2026","source":["S01","S117"],"note":"Reported government total. Not a live toll; later incidents are not automatically added."},{"id":"missing","value":"49","label":"People still missing","asof":"31 Aug 2026","source":["S01","S02","S117"],"note":"A separate missing-person category. Not a count to add to deaths."},{"id":"displaced","value":"~78,000","label":"Displaced at year-end 2025","asof":"31 Dec 2025","source":["S44","S107"],"note":"IDMC estimate reported in May 2026: approximately 52,000 in camps and 26,000 with hosts. Revised enumeration; not all new displacement."},{"id":"cases","value":"3,020","label":"Cases assigned to 36 SITs","asof":"17 Sep 2026 order","source":["S11"],"note":"302 charge sheets, 1,583 closure reports, 1,135 under investigation. Filing a closure report does not establish judicial acceptance."},{"id":"campDeaths","value":"640","label":"Recorded camp deaths, all causes","asof":"17 Sep 2026 order","source":["S11"],"note":"Deaths recorded across eight districts, including 34 described as unnatural. Not a violent-death toll and not additive to the 306 figure."},{"id":"health","value":"1,040","label":"Mental-health team camp visits","asof":"10 Mar 2026","source":["S25"],"note":"Service visits, not individual patients, diagnoses or population prevalence."},{"id":"healthAttacks","value":"24","label":"Documented health-sector incidents","asof":"May-Nov 2023","source":["S43"],"note":"SHCC / Insecurity Insight documented violence or obstruction affecting healthcare. A bounded historical dataset, not all health outcomes."}],"coverage":[["Legislative records","5 Assembly records; 5 Parliament records","Selected bulletins, resolutions, written answers and a debate document. Not a speech-by-speech audit of every session."],["Court records","3 primary-text records plus reported hearings","High Court and Supreme Court records are distinguished from reporting. Not a docket-complete archive or a live case tracker."],["Social platforms","Reported posts; no complete platform scrape","News-reproduced X and Facebook statements are included. Direct authenticated account ownership, deleted posts, private groups and every video have not been audited."],["Video and audio","25 individual outbound media listings","Includes publisher videos, direct platform links and podcasts. Descriptions or metadata reviewed; complete audiovisual material has not been independently watched or transcribed. Search launchers are not evidence."],["Regional-language press","Limited multilingual coverage","The collection is predominantly English, with selected Hindi, French and Indonesian reporting. Meiteilon and tribal-language archives remain under-covered."],["International and national press","Selected source-linked reporting","No claim to all BBC, CNN, Reuters, AP, newspaper, TV-channel or magazine output. Paywalls and access failures remain visible."],["Civil society and testimony","Multiple perspectives; incomplete coverage","An organisation's account is attributed. Testimonials are not representative samples; unverified private allegations and victim identifiers are excluded."],["Dates and quantities","Published snapshot through 12 Oct 2026","Publication dates and event dates differ. Some records have month/year precision only. Comparable denominators are required before calculating impact percentages."],["Geography","16 informational district polygons","District association shows indexing, not severity, territorial control, ethnicity, exact incident coordinates or proof that an unrepresented district was unaffected."],["Updates","Static, auditable build","No scheduled scrape, API integration or public hosting is configured. Local annotations and saved sources remain in this browser only."],["District expansion","All 16 dossiers now have at least one dated entry","Additional entries cover Senapati, Chandel, Pherzawl, Noney and Thoubal. Curfew rules, coordinator assignments, evacuations, reported attacks and natural hazards have separate types. Administrative coverage is not proof of an attack in every district."],["Video and social review","Outbound collection; no full audiovisual audit","Individual video / audio listings are separated from platform search launchers. Clips are not transcribed or independently authenticated. No individual Instagram reel was verified in this edition. Platform access may require login."],["World Bank and IMF","Economic context, not conflict findings","Located material is background metadata or national macroeconomic analysis. No Manipur conflict-specific World Bank or IMF assessment was located in this pass. Do not substitute a regional sample for a district loss estimate."],["Motion","User-controlled animation","Headings reveal on entry, diagram connections flow, quotes scroll and the navigation dial rotates. Pause motion and operating-system reduced-motion settings stop continuous animation."],["Source register","Category, then publication","The independent register groups all records by category and publisher, then sorts titles alphabetically. Its CSV export follows the same grouping. Original publication dates remain visible but are not the grouping key."]],"quotes":[{"text":"the country is with you, this house stands with you.","speaker":"Narendra Modi","role":"Prime Minister","date":"2023-08-10","forum":"Lok Sabha","source":"S21","context":"Official English transcript; reassurance during the no-confidence debate."},{"text":"Manipur has been split in two.","speaker":"Rahul Gandhi","role":"Congress MP at the time","date":"2023-08-09","forum":"Lok Sabha","source":"S111","context":"NDTV\u2019s reported English rendering of a political speech; not a legal finding."},{"text":"We are working with the goal of making Manipur a symbol of peace, prosperity and progress","speaker":"Narendra Modi","role":"Prime Minister","date":"2025-09-13","forum":"Churachandpur","source":"S30","context":"Official English press release; statement of the government\u2019s goal, not evidence it had been achieved."},{"text":"This silence is not normal.","speaker":"A. Bimol Akoijam","role":"Congress MP","date":"2024-07-01","forum":"Lok Sabha","source":"S109","context":"PTI report published 2 July describes a speech late Monday night, 1 July 2024. Criticism concerned omission of Manipur from the President\u2019s address."}],"videos":[{"id":"V01","source":"S30","title":"PM in Churachandpur: official programme video","publisher":"Prime Minister's Office","date":"2025-09-13","platform":"YouTube","url":"https://www.youtube.com/watch?v=176cBrJVAc8","kind":"Speech","topic":"Return & reconciliation","summary":"Official account of the Prime Minister's Churachandpur engagement and development announcements.","review":"Metadata / description reviewed; not independently viewed","note":"YouTube ID obtained from the player linked on the official PMO page. Speech metadata and source text reviewed, not the full video."},{"id":"V02","source":"S30","title":"PM programme in Churachandpur: original social post","publisher":"Prime Minister's Office","date":"2025-09-13","platform":"X / Twitter","url":"https://twitter.com/narendramodi/status/1966771270252720591","kind":"Speech","topic":"Return & reconciliation","summary":"Official account of the Prime Minister's Churachandpur engagement and development announcements.","review":"Metadata / description reviewed; not independently viewed","note":"Outbound link. Playback availability, login and regional restrictions are controlled by the publisher."},{"id":"V03","source":"S30","title":"PMO excerpt: hope and trust in Manipur","publisher":"Prime Minister's Office","date":"2025-09-13","platform":"X / Twitter","url":"https://twitter.com/PMOIndia/status/1966775465152311571","kind":"Clip","topic":"Return & reconciliation","summary":"Official account of the Prime Minister's Churachandpur engagement and development announcements.","review":"Metadata / description reviewed; not independently viewed","note":"Outbound link. Playback availability, login and regional restrictions are controlled by the publisher."},{"id":"V04","source":"S30","title":"PMO excerpt: peace, prosperity and progress","publisher":"Prime Minister's Office","date":"2025-09-13","platform":"X / Twitter","url":"https://twitter.com/PMOIndia/status/1966777920313086323","kind":"Clip","topic":"Return & reconciliation","summary":"Official account of the Prime Minister's Churachandpur engagement and development announcements.","review":"Metadata / description reviewed; not independently viewed","note":"Outbound link. Playback availability, login and regional restrictions are controlled by the publisher."},{"id":"V05","source":"S21","title":"PM: no-confidence reply, August 2023","publisher":"Prime Minister's Office","date":"2023-08-10","platform":"YouTube via publisher","url":"https://www.pmindia.gov.in/en/news_updates/pms-reply-to-the-no-confidence-motion-in-lok-sabha-on-10th-august-2023/","kind":"Speech","topic":"Governance","summary":"Condemns violence against women, promises action and restoration of peace, and contests opposition criticism o function safeURL(url){try{const u=new URL(url);return ['http:','https:'].includes(u.protocol)?u.href:'#';}catch{return '#';}}

try{const x=JSON.parse(localStorage.getItem('manipur-evidence-saved-v1')||'[]');if(Array.isArray(x))saved=new Set(x.filter(id=>BYID[id]));}catch{storageOK=false;}

function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2800);}
function saveSource(id){if(saved.has(id))saved.delete(id);else saved.add(id);try{localStorage.setItem('manipur-evidence-saved-v1',JSON.stringify([...saved]));}catch{storageOK=false;}$('savedCount').textContent=saved.size;document.querySelectorAll(`[data-save="${id}"]`).forEach(b=>{b.classList.toggle('saved',saved.has(id));b.textContent=saved.has(id)?'\u2605':'\u2606';b.setAttribute('aria-label',`${saved.has(id)?'Unsave':'Save'} ${id}`);});toast(saved.has(id)?`Saved ${id}${storageOK?' in this browser':' for this session'}`:`Removed ${id} from saved sources`);if(state.tab==='library'&&state.library.saved)renderLibraryResults();}
function saveBtn(s){return `<button class="save-btn ${saved.has(s.id)?'saved':''}" data-save="${s.id}" aria-label="${saved.has(s.id)?'Unsave':'Save'} ${s.id}">${saved.has(s.id)?'\u2605':'\u2606'}</button>`;}
function intro(kicker,title,description,side=''){return `<section class="page-intro"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${description}</p></div>${side?`<div class="intro-side">${side}</div>`:''}</section>`;}
function panelHead(kicker,title,sub='',action=''){return `<div class="panel-head"><div>${kicker?`<div class="eyebrow">${kicker}</div>`:''}<h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>${action}</div>`;}
function note(text,type=''){return `<div class="note ${type}">${text}</div>`;}
function sectionTitle(title,desc='',action=''){return `<div class="section-title"><div><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div>${action}</div>`;}
function metricCard(m){return `<article class="metric"><div class="metric-top"><span>Dated measure</span><button class="mini-link" data-source="${m.source[0]}" aria-label="Source for ${esc(m.label)}">&#8599;</button></div><div class="metric-value">${esc(m.value)}</div><h3 class="metric-label">${esc(m.label)}</h3><div class="metric-sub">As of ${esc(m.asof)}</div></article>`;}
function sourceCard(s){return `<article class="source-card"><div class="source-top"><span class="source-id">${s.id}</span>${saveBtn(s)}</div><div class="publisher">${esc(s.publisher)}</div><h3><button class="source-title" data-source="${s.id}" style="text-align:left;padding:0;font:inherit;letter-spacing:inherit">${esc(s.title)}</button></h3><div class="source-date">${esc(dateLabel(s.date))} &middot; ${esc(s.medium)}</div><p>${esc(s.summary)}</p><div class="tags">${tag(s.category)}${s.primary?tag('Primary text','primary'):''}</div><div class="card-bottom"><span class="fine">${esc(s.review)}</span><button class="mini-link" data-source="${s.id}">Read record &#8599;</button></div></article>`;}
function sourceCards(a){return a.length?`<div class="grid source-grid">${a.map(sourceCard).join('')}</div>`:empty('No indexed records match','Clear a filter or search more broadly. An empty result does not establish that nothing happened.');}
function empty(h,p){return `<div class="empty"><h3>${h}</h3><p>${p}</p></div>`;}
function chartDonut(items,center,caption){const total=sum(items.map(x=>x.value)),r=66,c=2*Math.PI*r;let offset=0;const segs=items.map(x=>{let n=x.value/total*c;let path=`<circle cx="100" cy="100" r="${r}" fill="none" stroke="${x.color}" stroke-width="20" stroke-dasharray="${n.toFixed(3)} ${(c-n).toFixed(3)}" stroke-dashoffset="${(-offset).toFixed(3)}" transform="rotate(-90 100 100)"><title>${esc(x.label)}: ${fmt(x.value)} (${(x.value/total*100).toFixed(1)}%)</title></circle>`;offset+=n;return path;}).join('');return `<div class="donut-wrap"><svg class="donut-svg" viewBox="0 0 200 200" role="img" aria-label="${esc(items.map(x=>x.label+': '+fmt(x.value)).join('; '))}"><circle cx="100" cy="100" r="66" fill="none" stroke="#22323c" stroke-width="20"/>${segs}<text x="100" y="101" text-anchor="middle" class="donut-value">${esc(center)}</text><text x="100" y="119" text-anchor="middle" class="donut-label">${esc(caption)}</text></svg><div class="donut-legend">${items.map(x=>`<div class="legend-line"><i class="swatch" style="background:${x.color}"></i><span>${esc(x.label)}<small>${(100*x.value/total).toFixed(1)}% of this total</small></span><b>${fmt(x.value)}</b></div>`).join('')}</div></div>`;}
function barChart(items,cap=9){const m=Math.max(...items.map(x=>x.value),1);return `<div class="bars">${items.slice(0,cap).map(x=>`<div class="bar-row"><span class="bar-label">${esc(x.label)}</span><div class="bar-track" title="${esc(x.label)}: ${x.value} indexed records"><div class="bar-fill" style="width:${Math.max(2,x.value/m*100)}%;${x.color?`background:${x.color}`:''}"></div></div><span class="bar-count">${x.value}</span></div>`).join('')}</div>`;}
function countBy(a,key){const counts={};a.forEach(x=>{const v=typeof key==='function'?key(x):x[key];counts[v]=(counts[v]||0)+1;});return Object.entries(counts).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value);}
const caseItems=[{label:'Charge sheets filed',value:302,color:'#cfb584'},{label:'Closure reports filed',value:1583,color:'#678896'},{label:'Under investigation',value:1135,color:'#ba9691'}];
function passesEvent(e,filter){return (!filter.year||e.date.startsWith(filter.year))&&(!filter.topic||e.topic===filter.topic)&&(!filter.kind||e.kind===filter.kind);}
function localEvents(name,filter={}){return EVENTS.filter(e=>e.districts.includes(name)&&passesEvent(e,filter)).sort(sortDate);}
function localSources(name){const linked=uniq(localEvents(name).flatMap(e=>e.sources));return SOURCES.filter(s=>s.districts.includes(name)||linked.includes(s.id)).sort(sortDate);}
function districtColor(n){return n===0?'#202e37':n<3?'#344d5b':n<6?'#4d6875':'#7b939d';}
function drawMap(filter={},large=false){const points=DISTRICTS.flatMap(d=>d.polygons.flat());let xs=points.map(p=>p[0]*.873),ys=points.map(p=>p[1]),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);const width=690,height=630,scale=Math.min(485/(maxx-minx),550/(maxy-miny));const ox=(width-(maxx-minx)*scale)/2,oy=42;const project=p=>[ox+(p[0]*.873-minx)*scale,oy+(maxy-p[1])*scale];let paths='',labels='';DISTRICTS.forEach(d=>{let count=localEvents(d.name,filter).length;let path=d.polygons.map(poly=>poly.map((p,i)=>{let q=project(p);return `${i?'L':'M'}${q[0].toFixed(2)},${q[1].toFixed(2)}`;}).join(' ')+' Z').join(' ');paths+=`<path class="map-district" d="${path}" fill="${districtColor(count)}" tabindex="0" role="button" aria-label="${esc(d.name)}: ${count} indexed events. Open district dossier." data-district="${esc(d.name)}"><title>${esc(d.name)}: ${count} indexed events</title></path>`;let [x,y]=project(d.label);let shifts={'Imphal East':[58,-16],'Imphal West':[-55,-13],'Thoubal':[53,14],'Bishnupur':[-60,6],'Kakching':[40,18],'Jiribam':[-34,-4]};let [dx,dy]=shifts[d.name]||[0,0];if(dx||dy)labels+=`<path d="M${x},${y} L${x+dx*.82},${y+dy}" stroke="#8da9b2" stroke-width=".7" fill="none" pointer-events="none"/>`;labels+=`<text x="${x+dx}" y="${y+dy-1}" text-anchor="middle" class="map-label" data-district="${esc(d.name)}">${esc(d.name)}</text>${large?`<text x="${x+dx}" y="${y+dy+12}" text-anchor="middle" class="map-count">${count} ${count===1?'entry':'entries'}</text>`:''}`;});return `<div class="map-frame ${large?'large':''}"><div class="map-note"><strong>DISTRICT INDEX</strong>Click a boundary.<br>Shading = indexed events,<br>not intensity of violence.</div><svg class="map-svg" viewBox="0 0 690 630" role="group" aria-label="Interactive Manipur district map"><defs><pattern id="mapgrid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#293c49" stroke-width=".5"/></pattern></defs><rect x="87" y="30" width="520" height="570" fill="url(#mapgrid)" opacity=".6"/><text x="612" y="75" class="map-guide" text-anchor="middle">N</text><path d="M612 105 L612 83 M607 89 L612 82 L617 89" stroke="#8aaeb8" fill="none" stroke-width="1"/>${paths}${labels}<text x="578" y="553" class="map-guide" transform="rotate(-90 578 553)">MYANMAR</text><text x="345" y="619" text-anchor="middle" class="map-guide">INFORMATIONAL BOUNDARIES / NOT AN OFFICIAL MAP</text></svg></div>`;}
function mapLegend(){return `<div class="legend">${[['#202e37','0'],['#344d5b','1-2'],['#4d6875','3-5'],['#7b939d','6+']].map(([color,l])=>`<span><i class="swatch" style="background:${color}"></i>${l}</span>`).join('')}<span>indexed event entries</span></div>`;}
function eventCard(e,compact=false){return `<article class="event-card" data-event-id="${e.id}"><div class="event-top"><span>${esc(dateLabel(e.date))}${e.endDate?' - '+esc(dateLabel(e.endDate)):''}</span>${tag(e.kind)}</div><h3>${esc(e.title)}</h3><p>${esc(e.summary)}</p>${!compact&&e.response?`<div class="subline"><b>Response:</b> ${esc(e.response)}</div>`:''}${!compact&&e.uncertainty?`<div class="subline"><b>Qualification:</b> ${esc(e.uncertainty)}</div>`:''}<div class="event-actions">${refs(e.sources)}${e.districts.length?`<button class="mini-link" data-district="${esc(e.districts[0])}">District dossier &#8599;</button>`:tag('Statewide / location unresolved')}</div></article>`;}
function overviewBase(){const recent=[EVENTS.find(e=>e.id==='E35'),EVENTS.find(e=>e.id==='E33'),EVENTS.find(e=>e.id==='E31')];return intro('Conflict, governance & the human record','Manipur. In evidence.','A research workstation connecting incidents, competing claims, institutional responses and the people affected. Every number keeps its source and reporting date.',`<strong>${SOURCES.length} source records</strong>${EVENTS.length} event entries &middot; ${CLAIMS.length} exchanges<br>16 districts &middot; 2023-2026`)+`<div class="metrics">${METRICS.slice(0,3).map(metricCard).join('')}<article class="metric metric-summary"><div class="metric-top"><span>Evidence register</span><span>&#8599;</span></div><div class="metric-value">${SOURCES.length}</div><h3 class="metric-label">Source-linked research records</h3><div class="metric-sub">Primary texts, reporting, testimony and commentary</div><button class="mini-link" data-nav="library" style="margin-top:8px">Explore the library &#8594;</button></article></div><div class="grid overview-grid"><section class="panel">${panelHead('Geographic intelligence','Follow the evidence by district','16 clickable districts; local event dossiers.',`<button class="mini-link" data-nav="atlas">Expand &#8599;</button>`)}${drawMap()}<div class="panel-foot">${mapLegend()}<span>Zero entries &#8800; unaffected</span></div></section><section class="panel">${panelHead('Latest indexed developments','A changing conflict','Later episodes must not be flattened into the 2023 narrative.')}<div class="latest-list">${recent.map(e=>{let d=new Date(e.date+'T12:00:00Z');return `<button class="latest-item" data-event="${e.id}"><span class="latest-date"><b>${d.getUTCDate()}</b>${d.toLocaleDateString('en-GB',{month:'short',timeZone:'UTC'}).toUpperCase()} 2026</span><span><h3>${esc(e.title)}</h3><p>${esc(e.summary)}</p>${tag(e.districts.join(' / '))}</span></button>`;}).join('')}</div><div class="panel-foot"><span>Event dates, not publication dates. Developing accounts remain provisional.</span><button class="mini-link" data-nav="atlas">Chronology &#8594;</button></div></section></div><div class="grid grid-2 section-gap"><section class="panel">${panelHead('Judicial accountability','The investigation pipeline','SIT-assigned cases recorded in the 17 September 2026 order.')}${chartDonut(caseItems,'3,020','ASSIGNED CASES')}<div class="panel-foot"><span>Closure reports are filings, not acquittals or confirmed judicial closures.</span>${refs(['S11'])}</div></section><section class="panel">${panelHead('Collection profile','What this archive covers','Counts of indexed source records, not a measure of human harm.')}${barChart(countBy(SOURCES,'category'),6)}<div class="panel-foot"><span>Publication families can overlap. Syndication is not independent corroboration.</span><button class="mini-link" data-nav="method">Method &#8599;</button></div></section></div><div class="editor-note section-gap"><strong>Do not mix denominators.</strong> The 306 reported conflict deaths, 49 people still missing, and 640 deaths from all causes recorded in camps are different measures. They must not be added into a single death toll. ${refs(['S01','S117','S11'])}</div>${sectionTitle('Start with the question')}<div class="grid grid-3">${[['causes','01 / CAUSES','What drives escalation?','Inspect linked mechanisms and competing explanations without fabricated causal percentages.'],['assembly','02 / CLAIMS & RESPONSES','What was actually said?','Read legislative questions, replies and unresolved gaps, with direct exchanges separated from later context.'],['voices','03 / HUMAN ACCOUNTS','Whose experience is documented?','Explore survivor reporting, investigations, international coverage and attributed public testimony.']].map(([t,k,h,p])=>`<article class="feature-card"><div class="feature-number">${k}</div><h3>${h}</h3><p>${p}</p><button class="mini-link" data-nav="${t}" style="margin-top:14px">Open research view &#8594;</button></article>`).join('')}</div>`;}
function options(a,value,all){return `<option value="">${esc(all)}</option>`+a.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('');}
function atlas(){return intro('Spatial context / dated incident register','Every district has a dossier.','Select a district boundary or a name. Records distinguish violent incidents, humanitarian snapshots and institutional milestones. Multi-district events are indexed once, then linked to each relevant district.')+`<div class="toolbar"><label for="atlasYear">PERIOD</label><select id="atlasYear" aria-label="Filter atlas by year">${options(['2026','2025','2024','2023'],state.atlas.year,'All years')}</select><select id="atlasTopic" aria-label="Filter atlas by issue">${options(uniq(EVENTS.map(e=>e.topic)).sort(),state.atlas.topic,'All issues')}</select><select id="atlasKind" aria-label="Filter atlas by event type">${options(uniq(EVENTS.map(e=>e.kind)).sort(),state.atlas.kind,'All record types')}</select>${button('Reset','atlas-reset','small')}<span class="result-count" id="atlasCount"></span></div><div id="atlasBody"></div>`;}
function renderAtlasBody(){const events=EVENTS.filter(e=>passesEvent(e,state.atlas)).sort(sortDate);$('atlasCount').textContent=`${events.length} dated entries`;$('atlasBody').innerHTML=`<div class="grid atlas-grid"><section class="panel">${panelHead('Click a boundary','District evidence atlas','Shading changes with your filters. The map does not show a frontline.')}${drawMap(state.atlas,true)}<div class="panel-foot">${mapLegend()}<button class="mini-link" data-nav="method">Boundary provenance &#8599;</button></div></section><section class="panel">${panelHead('District index','Choose a place','Counts use the active event filters.')}<div class="district-index">${DISTRICTS.slice().sort((a,b)=>localEvents(b.name,state.atlas).length-localEvents(a.name,state.atlas).length||a.name.localeCompare(b.name)).map(d=>{let n=localEvents(d.name,state.atlas).length;return `<button class="district-row" data-district="${esc(d.name)}"><span>${esc(d.name)}<small>${n?'Open local events and linked sources':'No local event indexed for these filters'}</small></span><span class="count">${n}</span></button>`;}).join('')}</div></section></div>${sectionTitle('Chronology','Publication dates and incident dates are stored separately.')}${events.length?`<div class="grid grid-2">${events.map(e=>eventCard(e)).join('')}</div>`:empty('No dated entries match','Change the filters. This collection does not establish an absence of violence.')}`;}
function openDistrict(name){if(!DISTRICTS.some(d=>d.name===name))return;state.district=name;state.districtYear=state.tab==='atlas'?state.atlas.year:'';state.districtTopic=state.tab==='atlas'?state.atlas.topic:'';state.districtType='all';returnFocus=document.activeElement;$('veil').hidden=false;$('drawer').hidden=false;document.body.style.overflow='hidden';renderDistrict();$('drawer').querySelector('[data-action="close-drawer"]').focus();}
function renderDistrict(){const name=state.district;let es=localEvents(name,{year:state.districtYear,topic:state.districtTopic});let ss=localSources(name).filter(s=>(!state.districtYear||s.date.startsWith(state.districtYear))&&(!state.districtTopic||s.topic===state.districtTopic)&& (state.districtType==='all'||s.category===state.districtType));const all=localSources(name);$('drawer').innerHTML=`<div class="drawer-top"><div><div class="eyebrow">District dossier / ${esc(name)}</div><h2 id="drawerTitle">${esc(name)}</h2><p class="subtitle">Events, institutional context and reporting linked to this district.</p></div><button class="icon-btn" data-action="close-drawer" aria-label="Close district dossier">&#215;</button></div><div class="drawer-counts">${tag(`${es.length} event entries`,'dark')}${tag(`${ss.length} linked sources`)}${tag('No severity score')}</div><div class="drawer-filters"><select class="field" id="districtYear" aria-label="Dossier year">${options(['2026','2025','2024','2023'],state.districtYear,'All years')}</select><select class="field" id="districtTopic" aria-label="Dossier issue">${options(uniq([...localEvents(name).map(e=>e.topic),...all.map(s=>s.topic)]).sort(),state.districtTopic,'All issues')}</select><select class="field" id="districtType" aria-label="Dossier source medium">${options(uniq(all.map(s=>s.category)).sort(),state.districtType==='all'?'':state.districtType,'All source categories')}</select></div>${note('District links include relevant statewide context. A linked institutional record does not imply the incident took place inside a court or government building.','slim')}${sectionTitle('What happened here?')}${es.length?es.map(e=>eventCard(e)).join(''):empty('No event entry indexed','This is a research gap, not a declaration that this district was unaffected.')}${sectionTitle('Read the reporting','',button('Open in library','district-library','small'))}${sourceCards(ss)}`;}
function closeDrawer(){if($('drawer').hidden)return;$('drawer').hidden=true;$('veil').hidden=true;document.body.style.overflow='';if(returnFocus&&document.contains(returnFocus))returnFocus.focus();}
function openEvent(id){const e=EVENTS.find(e=>e.id===id);if(!e)return;if(e.districts.length){openDistrict(e.districts[0]);setTimeout(()=>{const el=$('drawer').querySelector('[data-event-id="'+e.id+'"]');if(el)el.scrollIntoView({block:'center',behavior:'smooth'});},80);}else openSource(e.sources[0]);}
