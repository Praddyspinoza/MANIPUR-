function flowDiagram(mode){const selected=mode==='causes'?state.causeNode:state.consequenceNode,nodes=FLOWS[mode];const pos=[[45,46],[296,46],[547,46],[547,243],[296,243],[45,243]];return `<div class="flow-panel"><svg class="flow-svg" viewBox="0 0 790 370" role="group" aria-label="${mode==='causes'?'Cause':'Consequence'} cycle, an analytical synthesis, not measured causal weights"><defs><marker id="arrow-${mode}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#ab966c" stroke-width="1.5"/></marker></defs>${['M245 90 H291','M496 90 H542','M647 140 V236','M547 287 H501','M296 287 H250','M145 243 V144'].map(d=>`<path class="flow-path" marker-end="url(#arrow-${mode})" d="${d}"/>`).join('')}<text x="395" y="188" text-anchor="middle" class="flow-note">INTERACTING PATHWAYS, NOT MEASURED CAUSAL SHARES</text><text x="395" y="207" text-anchor="middle" class="flow-note">Click a mechanism to inspect its evidence</text>${nodes.map((n,i)=>{let [x,y]=pos[i];return `<g class="flow-node ${selected===i?'selected':''}" tabindex="0" role="button" aria-label="${n.title.join(' ')}" data-flow="${mode}" data-index="${i}"><rect class="flow-box" x="${x}" y="${y}" width="200" height="97" rx="11"/><text class="flow-index" x="${x+16}" y="${y+21}">0${i+1}</text><text class="flow-text" x="${x+16}" y="${y+44}">${n.title[0]}<tspan x="${x+16}" dy="19">${n.title[1]}</tspan></text><text class="flow-small" x="${x+16}" y="${y+82}">${n.ids.length} linked evidence records</text></g>`;}).join('')}</svg></div><div class="mechanism"><div><div class="eyebrow">Selected mechanism</div><h3>${nodes[selected].detail}</h3></div><div><p>${nodes[selected].text}</p>${refs(nodes[selected].ids)}</div></div>`;}
function causesInternal(){const relevant=SOURCES.filter(s=>['Land & identity','Armed violence','Governance','Information disorder'].includes(s.topic));const grouped=countBy(relevant,'topic');const colors=['#cfb584','#91aeb4','#ba9691','#465d68'];return intro('Analytical synthesis / competing explanations','How escalation takes hold.','Follow the mechanisms, inspect the sources and compare the explanations. The arrows show an analytical framework: they are not a court finding or an estimate of how much each cause contributed.')+`<section class="panel">${panelHead('Interactive cause cycle','Grievance, mobilisation and escalation','Select any node to read its evidence trail.')}<div id="causeFlow">${flowDiagram('causes')}</div></section><div class="grid grid-2 section-gap"><section class="panel">${panelHead('Corpus composition','Which drivers are discussed?','One primary theme per indexed source in this selected subset.')}${chartDonut(grouped.map((x,i)=>({...x,color:colors[i%colors.length]})),String(relevant.length),'SOURCE RECORDS')}<div class="panel-foot"><span>These are shares of the collection, not shares of responsibility or human impact.</span></div></section><section class="panel">${panelHead('Read the explanations side by side','No single narrative is assumed')}<div class="panel-pad"><div class="compare-label">Government explanations</div><p class="fine">Migration, new villages, armed groups and the ST-status dispute appear in official and reported government explanations. They remain attributed positions.</p>${refs(['S18','S23','S114','S115'])}<div class="spacer"></div><div class="compare-label">Criticism and alternative explanations</div><p class="fine">Survivor reporting, rights organisations and interviewees question protection, partial enforcement and policy choices. Each claim still needs specific evidence.</p>${refs(['S36','S74','S86'])}<div class="spacer"></div>${note('Neither an ethnic label nor a general migration allegation establishes individual responsibility.','slim')}</div></section></div>${sectionTitle('Evidence checks that change the story')}<div class="grid grid-3">${[['The court did not grant ST status.','Read the operative order and review instead of repeating an inaccurate shorthand.',['S13','S14']],['A recovered weapon is not automatically a looted weapon.','The case or return programme must define the universe before totals are compared.',['S96','S11']],['A debunked post is a specific correction.','It is not proof that all allegations from a community are false.',['S77','S76']]].map(([h,p,ids],i)=>`<article class="feature-card"><div class="feature-number">CHECK / 0${i+1}</div><h3>${h}</h3><p>${p}</p>${refs(ids)}</article>`).join('')}</div>`;}
function consequencesInternal(){return intro('Human consequences / measurable outcomes','What violence leaves behind.','Keep lives, households, service activity and legal cases in separate units. The charts below show defined measurements, while the flowchart connects the wider consequences without inventing impact percentages.')+`<section class="panel">${panelHead('Interactive consequence cycle','From direct harm to prolonged insecurity','Select a node to inspect the associated evidence.')}<div id="consequenceFlow">${flowDiagram('consequences')}</div></section><div class="grid grid-2 section-gap"><section class="panel">${panelHead('Displacement stock / end-2025','Where displaced people were living','Approximate IDMC breakdown reported in May 2026.')}${chartDonut([{label:'In camps',value:52000,color:'#cfb584'},{label:'With host families',value:26000,color:'#7398a5'}],'~78k','DISPLACED PEOPLE')}<div class="panel-foot"><span>Rounded estimates. Not new displacement in 2025, not a count of every resident outside Manipur.</span>${refs(['S44','S107'])}</div></section><section class="panel">${panelHead('Do not add these numbers','Different measures, different denominators')}<div class="panel-pad">${[METRICS[0],METRICS[4],METRICS[5],METRICS[6]].map(m=>`<div class="key-stat"><div><h4>${esc(m.label)}</h4><p>${esc(m.asof)}</p>${refs(m.source)}</div><strong>${esc(m.value)}</strong></div>`).join('')}</div></section></div>${sectionTitle('Impact by issue','Coverage in this archive is not population prevalence.')}<div class="grid grid-3">${[['Displacement & return','An administrative resettlement claim, a camp count and an IDMC estimate answer different questions. Safe, voluntary and durable return needs separate evidence.',['S03','S37','S44','S101']],['Education, health & care','Written parliamentary answers record service provision, while reports describe attacks or obstruction. Neither substitutes for a representative needs survey.',['S25','S43','S18']],['Family life & protection','Mixed families and displaced survivors describe profound disruption. Personal accounts illustrate experience; they do not establish a statistical distribution of harms.',['S84','S62','S74']]].map(([h,p,ids])=>`<article class="feature-card"><h3>${h}</h3><p>${p}</p>${refs(ids)}</article>`).join('')}</div><div class="editor-note section-gap"><strong>Camp deaths need their own investigation.</strong> The 17 September order records 640 camp deaths across eight districts, including 34 described as unnatural, and seeks further explanations. These figures must not be relabelled as 640 people killed in violence.${refs(['S11'])}</div>`;}
function claimCard(c){return `<article class="claim-card"><div class="claim-header"><span>${c.id} / ${esc(dateLabel(c.date))}</span>${tag(c.relationship.includes('Direct')?'Primary exchange':c.relationship.includes('Reported')?'Reported exchange':'Context / attribution')}</div><h3>${esc(c.title)}</h3><div class="exchange"><section class="position"><div class="position-label">QUESTION / POSITION</div><h4>${esc(c.speakerA)}</h4><p>${esc(c.positionA)}</p>${refs(c.sourcesA)}</section><section class="position"><div class="position-label">RESPONSE / COUNTERPOINT</div><h4>${esc(c.speakerB)}</h4><p>${esc(c.positionB)}</p>${refs(c.sourcesB)}</section></div><div class="claim-note"><strong>${esc(c.relationship)}</strong>${esc(c.note)}</div></article>`;}
function legislature(forum){const isA=forum==='Assembly';const items=CLAIMS.filter(c=>c.forum===forum);let primary=SOURCES.filter(s=>s.category===(isA?'Assembly record':'Parliament record'));return intro(isA?'State legislature / questions, replies & context':'Union legislature / debates & written answers',isA?'What the Assembly record says.':'What Parliament was told.',isA?'Government statements, opposition questions and actual replies, separated from press remarks and later policy developments. Procedural bulletins are not verbatim transcripts.':'Keep Lok Sabha and Rajya Sabha separate, and distinguish spoken debate from written answers. A political counterargument is not necessarily an evidentiary rebuttal.',`<strong>${items.length} exchanges</strong>${primary.length} primary-record entries<br>Direct response labels retained`)+note(isA?'Some exchanges are available only through reporting. The March 2026 bulletin contains an internal date inconsistency; the record is labelled rather than silently corrected.':'Some 2023 proceedings are uncorrected or were subsequently expunged in part. This terminal paraphrases issues and does not present news quotations as the final parliamentary text.','slim')+`<div class="toolbar section-gap"><input id="claimSearch" placeholder="Search speaker, question, reply or issue..." aria-label="Search legislative exchanges" value="${esc(state.claimQuery)}"><select id="claimYear" aria-label="Filter exchanges by year">${options(['2026','2025','2024','2023'],state.claimYear,'All years')}</select><span id="claimCount" class="result-count"></span></div><div id="claimResults"></div>${sectionTitle('Primary-record shelf','Open the document provenance before quoting a passage.')}<div class="grid source-grid">${primary.map(sourceCard).join('')}</div>`;}
function renderClaims(){const forum=state.tab==='assembly'?'Assembly':'Parliament';let q=state.claimQuery.toLowerCase();let items=CLAIMS.filter(c=>c.forum===forum&&(!state.claimYear||c.date.startsWith(state.claimYear))&&(!q||[c.title,c.speakerA,c.speakerB,c.positionA,c.positionB,c.note].join(' ').toLowerCase().includes(q)));$('claimCount').textContent=`${items.length} exchanges`;$('claimResults').innerHTML=items.length?`<div class="grid claim-grid">${items.map(claimCard).join('')}</div>`:empty('No exchange matches','Try a surname, another issue or a different year.');}
function courts(){const items=['S10','S11','S13','S12','S103','S88'].map(id=>BYID[id]);return intro('Justice, investigation & institutional oversight','Read the order. Not just the headline.','Primary court texts, reported hearings and statutory notices are labelled separately. Directions, charges, closure filings and convictions are distinct legal events.',`<strong>29 October 2026</strong>Next date recorded in the<br>17 September Supreme Court order`)+`<div class="grid grid-2"><section class="panel">${panelHead('Supreme Court / 17 September 2026','SIT case disposition','Government-submitted status recorded in the order.')}${chartDonut(caseItems,'3,020','SIT CASES')}<div class="panel-foot"><span>302 + 1,583 + 1,135 = 3,020. A filing is not a verdict.</span>${refs(['S11'])}</div></section><section class="panel">${panelHead('What the figures establish','Interpretation guardrails')}<div class="panel-pad"><div class="key-stat"><div><h4>SITs in the reported framework</h4><p>Not the total number of all investigative agencies.</p></div><strong>36</strong></div><div class="key-stat"><div><h4>Trials reported to have begun</h4><p>A subset, not an extra case-disposition category.</p></div><strong>33</strong></div><div class="key-stat"><div><h4>Camp deaths recorded, all causes</h4><p>The Court sought fuller explanation and follow-up.</p></div><strong>640</strong></div>${refs(['S11'])}</div></section></div>${sectionTitle('The legal sequence')}<div class="grid grid-3">${[['2023 / OVERSIGHT','Protect, investigate, rehabilitate','The Supreme Court established a former-judges committee and investigation oversight. These arrangements are not findings of guilt.',['S10']],['2024 / REVIEW','The limited ST-order deletion','The High Court deleted a direction to consider an ST recommendation. It neither granted ST status nor decided every underlying eligibility issue.',['S13','S14']],['2025-2026 / FOLLOW-UP','Progress, delays and missing information','Reported High Court scrutiny of Jiribam and the later Supreme Court compliance order concern distinct proceedings.',['S103','S11']]].map(([k,h,p,ids])=>`<article class="feature-card"><div class="feature-number">${k}</div><h3>${h}</h3><p>${p}</p>${refs(ids)}</article>`).join('')}</div>${sectionTitle('Orders, reported hearings and notices')}${sourceCards(items)}<div class="editor-note section-gap"><strong>Research rule:</strong> a news account of an oral observation is not the operative order. An NHRC notice is not a court judgment. The next hearing date is taken from the linked order and must be rechecked before use as a current schedule.${refs(['S11','S88'])}</div>`;}
function reportSubset(){let a=SOURCES.filter(s=>['International reporting','Testimony','Investigation','Social & audio','Broadcast & video','Fact-check','Opinion / blogs','Regional reporting'].includes(s.category)||s.tags.includes('Reported social post'));const mode=state.reportMode;if(mode==='testimony')a=a.filter(s=>s.category==='Testimony'||s.tags.some(t=>['Survivor account','Mixed families'].includes(t)));if(mode==='international')a=a.filter(s=>s.category==='International reporting');if(mode==='investigation')a=a.filter(s=>['Investigation','Fact-check'].includes(s.category));if(mode==='social')a=a.filter(s=>s.tags.includes('Reported social post')||['Social & audio','Broadcast & video','Opinion / blogs'].includes(s.category));if(mode==='regional')a=a.filter(s=>s.category==='Regional reporting');return a.sort(sortDate);}
function voices(){return intro('People, reporting & the public record','Experience behind the statistics.','First-person reporting, investigations and international accounts are indexed without reproducing graphic material or identifying vulnerable survivors. Published testimony remains attributed; it is not a representative survey.')+`<div class="pill-tabs">${[['all','All reporting'],['testimony','Personal accounts'],['investigation','Investigations & fact-checks'],['international','International'],['social','Social, video & Substack'],['regional','Regional coverage']].map(([v,l])=>`<button class="pill ${state.reportMode===v?'active':''}" data-report="${v}">${l}</button>`).join('')}</div><div id="reportNotes"></div><div id="reportResults"></div>`;}
function renderVoices(){const social=state.reportMode==='social';$('reportNotes').innerHTML=social?`${note('<strong>Access distinction:</strong> the social records here are posts reproduced in reporting, publisher video listings and podcast descriptions. This is not a direct scrape of authenticated Facebook, Instagram, X or YouTube accounts. Full videos and audio have not been transcribed.','warning')}<div class="panel section-gap">${[['Former CM N. Biren Singh / Imo Singh','Reported X posts about the February 2024 SoO resolution.',['S17']],['Manipur Police','A police statement is reproduced in reporting on the Leithao deaths.',['S87']],['ITAC / @itacofficial','A reported June 2024 X statement concerning Jiribam arson. Account ownership has not been independently audited.',['S99']],['Chief Minister\'s public appeal','The October 2026 IANS account reports social-media appeals; no original post is archived here.',['S06']],['Frontline / Substack','Two Mission Manipur podcast descriptions are indexed, not full episode transcripts.',['S80','S81']]].map(([h,p,ids])=>`<div class="social-row"><h4>${h}</h4><p>${p}</p>${refs(ids)}</div>`).join('')}</div><div class="spacer"></div>`:note('Selection reflects this research collection, not all coverage. Some records are accessible extracts or brief catalogue entries; each record shows its review depth.','slim')+'<div class="spacer"></div>';$('reportResults').innerHTML=sourceCards(reportSubset());}
function civil(){let orgSources=SOURCES.filter(s=>s.category==='Civil society');return intro('Civil society / scrutiny, relief & advocacy','Document the demand. Check the response.','Rights organisations, humanitarian agencies, local civil-society groups and defenders are not interchangeable. Their reports, advocacy, programme descriptions and rebuttals remain attributed and individually linked.')+`<div class="pill-tabs">${[['all','Organisations & reports'],['responses','Documented responses'],['directory','Coverage directory']].map(([v,l])=>`<button class="pill ${state.civilMode===v?'active':''}" data-civil="${v}">${l}</button>`).join('')}</div><div id="civilResults"></div>`;}
function renderCivil(){if(state.civilMode==='responses'){$('civilResults').innerHTML=note('These are documented responses or competing accounts. No rebuttal is invented where a directly linked response was not located.','slim')+`<div class="grid claim-grid section-gap">${CLAIMS.filter(c=>c.forum==='Public record').map(claimCard).join('')}</div>`;return;}if(state.civilMode==='directory'){const orgs=[['Human Rights Watch','Annual and incident-focused rights reporting',['S33','S34','S35']],['Amnesty International','Testimony, return and hostage protection',['S36','S37','S38']],['PUCL / People\'s Tribunal','Non-statutory tribunal and recommendations',['S39','S40']],['Editors Guild / regional press bodies','Fact-finding and formal rebuttals',['S49','S50','S51']],['Caritas / Indian Red Cross','Relief and programme accounts',['S41','S47','S48']],['IDMC / ACAPS / SHCC','Displacement, humanitarian needs and health-sector incidents',['S44','S42','S43']],['NFIW / CSSS','Delegation and fact-finding accounts',['S45','S46']],['UN experts / European Parliament','International institutional scrutiny, not NGO judgments',['S52','S54']],['Human-rights defenders','Protection appeals relating to Babloo Loitongbam',['S57','S58']],['ITLF / ITAC / Thadou Community International','Statements reproduced in incident reporting',['S63','S99','S104']],['Kuki-Zo Council / local organisations','Dialogue, restrictions and contested return',['S72','S73','S102']],['Women, diaspora and mixed families','First-person and community accounts',['S60','S74','S84','S94']]];$('civilResults').innerHTML=`<div class="panel">${orgs.map(([h,p,ids])=>`<div class="social-row"><h4>${h}</h4><p>${p}</p>${refs(ids)}</div>`).join('')}</div><div class="spacer"></div>${note('This is an indexed coverage directory, not a claim to every NGO or a verified directory of official social-media handles. Community organisations may take political positions.','slim')}`;return;}$('civilResults').innerHTML=sourceCards(SOURCES.filter(s=>s.category==='Civil society').sort(sortDate));}
function library(){return intro('Source register / search, save & export','The evidence library.','Search original-source links, review depth, district associations and editorial qualifications. Save a reading list locally or export the filtered records for the media desk.',`<strong>${SOURCES.length} records</strong>${uniq(SOURCES.map(s=>s.category)).length} source categories<br>${SOURCES.filter(s=>s.primary).length} primary-text / official entries`)+`<div class="toolbar"><input id="libSearch" aria-label="Search source library" placeholder="Search publisher, speaker, place or issue..." value="${esc(state.library.q)}"><select id="libCategory" aria-label="Source category">${options(uniq(SOURCES.map(s=>s.category)).sort(),state.library.category,'All source categories')}</select><select id="libYear" aria-label="Publication year">${options(['2026','2025','2024','2023'],state.library.year,'All years')}</select><select id="libDistrict" aria-label="Associated district">${options(DISTRICTS.map(d=>d.name).sort(),state.library.district,'All districts')}</select><select id="libTopic" aria-label="Primary source issue">${options(uniq(SOURCES.map(s=>s.topic)).sort(),state.library.topic,'All issues')}</select><button id="libSaved" class="btn small ${state.library.saved?'primary':''}" data-action="lib-saved">${state.library.saved?'\u2605 Saved only':'\u2606 Saved only'}</button>${button('Reset','lib-reset','small')}</div><div class="section-title"><span class="result-count" id="libraryCount" style="margin-left:0"></span><div class="actions">${button('Export filtered CSV','csv','small')}${button('Export complete JSON','json','small')}</div></div><div id="libraryResults"></div>`;}
function filteredSources(){let f=state.library,q=f.q.trim().toLowerCase();let localIds=f.district?new Set(localSources(f.district).map(s=>s.id)):null;return SOURCES.filter(s=>(!q||[s.id,s.publisher,s.title,s.summary,s.note,...s.tags,...s.districts].join(' ').toLowerCase().includes(q))&&(!f.category||s.category===f.category)&&(!f.year||s.date.startsWith(f.year))&&(!f.topic||s.topic===f.topic)&&(!localIds||localIds.has(s.id))&&(!f.saved||saved.has(s.id))).sort(sortDate);}
function renderLibraryResults(){const items=filteredSources();$('libraryCount').textContent=`${items.length} of ${SOURCES.length} source records${state.library.district?' | includes linked statewide context':''}`;$('libraryResults').innerHTML=sourceCards(items);}
function method(){return intro('Provenance / limits / reuse','What this terminal can establish.','A dated research collection with working tools is not the same thing as an exhaustive archive. Review depth and attribution are part of the evidence, not fine print.')+`<div class="metrics"><article class="metric"><div class="metric-top">Linked source entries</div><div class="metric-value">${SOURCES.length}</div><div class="metric-label">Not unique investigations</div></article><article class="metric"><div class="metric-top">Curated chronology</div><div class="metric-value">${EVENTS.length}</div><div class="metric-label">Mixed event types</div></article><article class="metric"><div class="metric-top">Question / response pairs</div><div class="metric-value">${CLAIMS.length}</div><div class="metric-label">Relationship labels retained</div></article><article class="metric"><div class="metric-top">Geographic coverage</div><div class="metric-value">16</div><div class="metric-label">Informational district boundaries</div></article></div><section class="panel">${panelHead('Coverage audit','Strong distinctions. Visible gaps.')}<div style="margin-top:13px">${DATA.coverage.map(([h,s,p])=>`<article class="coverage-item"><h3>${esc(h)}</h3><div><strong>${esc(s)}</strong><p>${esc(p)}</p></div></article>`).join('')}</div></section>${sectionTitle('Rules for using this material')}<div class="grid grid-2"><section class="panel panel-pad"><h3>Evidence and language</h3><ul class="method-list"><li><strong>Primary text</strong> means a judgment, bulletin, question, official release or organisation's own statement. It does not mean every allegation in it is proven.</li><li><strong>Indexed extract</strong> means the search-accessible material supported the entry. It does not mean every paragraph, attachment or video was reviewed.</li><li><strong>Document reviewed</strong> distinguishes fuller text inspection from an index-only entry. Paywall and video-description limitations are retained.</li><li><strong>Rebuttal</strong> means a documented response. Denial alone is not disproof; a later statement is not a same-sitting answer.</li><li>Quotes from survivors are not reproduced at length. Identities and graphic sexual-violence material are omitted.</li></ul></section><section class="panel panel-pad"><h3>Counting and mapping</h3><ul class="method-list"><li>Source charts count records, not public opinion, media reach or harm. Each source receives one editorial primary issue.</li><li>Syndicated articles and related parliamentary/video records can share a source family. Distinct URLs do not guarantee independent corroboration.</li><li>Multi-district events are one event record with multiple geographic associations. Do not sum district counts into unique incidents.</li><li>Zero indexed events means a collection gap, not an unaffected district.</li><li>Maps do not show precise survivor locations, tactical positions, ethnic boundaries, territorial control or an official legal boundary certification.</li></ul></section></div>${sectionTitle('Boundary provenance & technical design')}<div class="panel panel-pad"><p class="fine">The map uses the publicly curated Manipur district topology in <a href="https://github.com/udit-001/india-maps-data/blob/main/topojson/states/manipur.json" target="_blank" rel="noopener noreferrer">udit-001 / india-maps-data</a>, blob <code>207984244e523b29f203aad5d3106112b3885090</code>. The source contains mixed 2011/2016 metadata and disclaims cartographic authority. Geometry was decoded and embedded locally; no external tile server is needed. No third-party licence is asserted by this terminal.</p><div class="spacer"></div><p class="fine">All interactive views, charts, the map and source metadata run without a network connection. Original-source links need internet access and may encounter paywalls, changed URLs or publisher restrictions. No HTTP-200 guarantee is made. The research snapshot was compiled through 12 October 2026; no live refresh or social API is configured. Saved sources use local browser storage when available, not a server or shared team account.</p><div class="actions section-gap">${button('Export complete research JSON','json','primary')}${button('Open source library','library','')}${button('Print this view','print','')}</div></div>`;}
function openSource(id){const s=BYID[id];if(!s)return;const relatives=SOURCES.filter(x=>x.id!==id&&x.family===s.family);$('sourceDialog').innerHTML=`<div class="modal-header"><div class="tags">${tag(s.id,'dark')}${tag(s.category)}${s.primary?tag('Primary / official text','primary'):''}</div><button class="icon-btn" data-action="close-source" aria-label="Close source record">&#215;</button></div><div class="modal-body"><div class="publisher">${esc(s.publisher)}</div><h2>${esc(s.title)}</h2><div class="meta-grid"><div><label>Publication / record date</label><span>${esc(dateLabel(s.date))} (${esc(s.datePrecision)} precision)</span></div><div><label>Review depth</label><span>${esc(s.review)}</span></div><div><label>Medium / language</label><span>${esc(s.medium)} / ${esc(s.language)}</span></div><div><label>Research access date</label><span>12 October 2026</span></div></div><p>${esc(s.summary)}</p>${s.note?note(`<strong>Qualification:</strong> ${esc(s.note)}`,'slim'):''}<div class="tags section-gap">${s.tags.map(t=>tag(t)).join('')}${s.districts.map(d=>`<button class="tag" data-district="${esc(d)}">${esc(d)} &#8599;</button>`).join('')}</div>${relatives.length?`<div class="fine section-gap">Related source family: not independent corroboration.${refs(relatives.map(x=>x.id))}</div>`:''}<div class="url-display">${esc(s.url)}</div><div class="actions"><a class="btn primary" href="${attrs(safeURL(s.url))}" target="_blank" rel="noopener noreferrer">Open original source &#8599;</a>${saveBtn(s)}<button class="btn" data-copy="${s.id}">Copy citation</button></div><p class="fine" style="font-size:10px;margin:14px 0 0">This record is a summary, not a reproduced article or a finding of guilt. Links may require internet access or a publisher subscription.</p></div>`;if(!$('sourceDialog').open)$('sourceDialog').showModal();}
function exportFile(content,name,type){const b=new Blob([content],{type});const url=URL.createObjectURL(b);let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast(`Exported ${name}`);}
function exportCSV(){const cols=['id','date','datePrecision','publisher','title','category','topic','districts','tags','review','summary','note','url','primary','family'];const csvCell=v=>'"'+String(Array.isArray(v)?v.join('; '):v??'').replace(/"/g,'""')+'"';let a=state.tab==='library'?filteredSources():SOURCES;let text='\ufeff'+[cols.join(','),...a.map(s=>cols.map(k=>csvCell(s[k])).join(','))].join('\r\n');exportFile(text,`manipur_sources_${a.length}_2026-10-12.csv`,'text/csv;charset=utf-8');}
function exportJSON(){exportFile(JSON.stringify({...DATA,readingList:[...saved],exportedAt:new Date().toISOString()},null,2),'manipur_research_snapshot.json','application/json');}
function copyText(text){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>toast('Citation copied')).catch(()=>fallbackCopy(text));}else fallbackCopy(text);}
function fallbackCopy(text){const a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity='0';const parent=$('sourceDialog').open?$('sourceDialog'):document.body;parent.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy');}catch{}a.remove();toast(ok?'Citation copied':'Copy unavailable. Select the source link in the record.');}
function openSearch(){$('searchDialog').showModal();$('globalSearch').value='';renderGlobal('');setTimeout(()=>$('globalSearch').focus(),20);}
function renderGlobal(q){q=q.toLowerCase().trim();if(!q){$('globalResults').innerHTML='<div class="search-helper">Try a district, a speaker, a source ID or a phrase: <strong>Jiribam</strong>, <strong>NCW</strong>, <strong>S11</strong>, <strong>Substack</strong>.</div>';return;}let res=SOURCES.filter(s=>[s.id,s.publisher,s.title,s.summary,s.note,...s.tags,...s.districts].join(' ').toLowerCase().includes(q)).slice(0,12);$('globalResults').innerHTML=res.length?res.map(s=>`<button class="global-result" data-global-source="${s.id}"><small>${s.id} &middot; ${esc(s.publisher)} &middot; ${esc(dateLabel(s.date))}</small><strong>${esc(s.title)}</strong></button>`).join(''):'<div class="search-helper">No indexed records match. The collection is not exhaustive.</div>';}
function navTo(t){if(![...NAV.map(x=>x[0]),'method'].includes(t))t='overview';closeDrawer();if($('sourceDialog').open)$('sourceDialog').close();if($('searchDialog').open)$('searchDialog').close();if(location.hash.slice(1)!==t){location.hash=t;}else route();}
function route(){let t=location.hash.slice(1)||'overview';if(![...NAV.map(x=>x[0]),'method'].includes(t))t='overview';state.tab=t;state.claimQuery='';state.claimYear='';$('mainNav').innerHTML=NAV.map(([id,label,n,ic])=>`<button class="nav-item ${id===t?'active':''}" data-nav="${id}" ${id===t?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${ic}</span><span>${label}</span><span class="num">${n}</span></button>`).join('');$('crumb').textContent=t==='method'?'COVERAGE & METHOD':NAV.find(x=>x[0]===t)[1].toUpperCase();const renders={overview,atlas,causes,consequences,assembly:()=>legislature('Assembly'),parliament:()=>legislature('Parliament'),courts,voices,civil,library,international,videos,register,method};$('workspace').innerHTML=renders[t]();if(t==='atlas')renderAtlasBody();if(t==='library')renderLibraryResults();if(t==='assembly'||t==='parliament')renderClaims();if(t==='voices')renderVoices();if(t==='civil')renderCivil();if(t==='international')renderInternational();if(t==='videos')renderVideos();if(t==='register')renderRegister();animateHeadings();document.querySelector('.rail').classList.remove('open');window.scrollTo({top:0,behavior:'instant'});document.title=`${t==='method'?'Coverage & Method':NAV.find(x=>x[0]===t)[1]} | Manipur Obsidian Terminal`;}
/* Obsidian edition: independent views over the same auditable records. */
const EXTRA={causeScope:'internal',externalScope:'northeast',impactScope:'manipur',video:{q:'',platform:'',kind:''},register:{q:'',category:'',publisher:''},international:'all'};
const K=DATA.keys;
const sid=k=>K[k];
const citeKeys=a=>refs(a.map(sid));
const keyCards=items=>`<div class="grid grid-3">${items.map((x,i)=>`<article class="feature-card"><div class="feature-number">${String(i+1).padStart(2,'0')} / ${esc(x.label||'EVIDENCE THREAD')}</div><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p>${refs(x.ids||x.keys.map(sid))}${x.qualifier?`<div class="qualification">${esc(x.qualifier)}</div>`:''}</article>`).join('')}</div>`;
function tabs(items,active,attr){return `<div class="scope-switch" role="group" aria-label="Research scope">${items.map(([id,t])=>`<button class="scope-button ${id===active?'active':''}" ${attr}="${id}" aria-pressed="${id===active}">${esc(t)}</button>`).join('')}</div>`;}
function quoteRibbon(){const quote=q=>`<div class="quote-item"><span class="quote-role">${esc(q.role)} / ${esc(dateLabel(q.date))}</span><q>${esc(q.text)}</q><button class="quote-speaker" data-source="${q.source}" title="${esc(q.context)}">${esc(q.speaker)} <span>${esc(q.forum)} &#8599;</span></button></div>`;return `<section class="quotation-band" aria-label="Dated quotations from government and opposition"><div class="ribbon-label"><span class="live-mark"></span>ON THE RECORD<small>Historical statements<br>Not a live feed</small></div><div class="quote-window"><div class="quote-track">${DATA.quotes.map(quote).join('')}<div class="quote-copy" aria-hidden="true" inert>${DATA.quotes.map(quote).join('')}</div></div></div><details class="quote-access"><summary>Read all 4 quotes</summary><div class="quote-access-list">${DATA.quotes.map(quote).join('')}</div></details></section>`;}
function researchDial(){let positions=[[50,6],[82,18],[96,50],[82,82],[50,94],[18,82],[4,50],[18,18]];let items=[['atlas','District atlas'],['causes','Causes'],['consequences','Consequences'],['international','Global lens'],['videos','Video library'],['register','Source register'],['parliament','Parliament'],['courts','Court record']];return `<div class="dial-wrap"><div class="dial-label">THE RESEARCH INDEX <span>08 PATHWAYS</span></div><div class="research-dial" role="group" aria-label="Rotating research dial; choose a tab"><div class="dial-ring ring-one" aria-hidden="true"></div><div class="dial-ring ring-two" aria-hidden="true"></div><div class="dial-ring ring-three" aria-hidden="true"></div><div class="dial-cross" aria-hidden="true"></div><div class="dial-satellite" aria-hidden="true"><i></i></div><button class="dial-center" data-nav="library"><span class="dial-monogram">M</span><small>OPEN THE<br>EVIDENCE LIBRARY</small><span class="dial-center-arrow">&#8599;</span></button>${items.map(([id,l],i)=>`<button class="dial-choice" data-nav="${id}" style="--x:${positions[i][0]}%;--y:${positions[i][1]}%"><span class="dial-number">0${i+1}</span><span>${l}</span></button>`).join('')}</div><div class="dial-caption">Select a pathway. Follow the source.</div></div>`;}
function overview(){const body=overviewBase().replace(/<section class="page-intro">[\s\S]*?<\/section>/,'');return quoteRibbon()+`<section class="obsidian-hero"><div class="hero-copy"><div class="eyebrow">MANIPUR / CONFLICT, GOVERNANCE &amp; THE NORTHEAST</div><h1>Manipur.<br><em>Beyond the headline.</em></h1><p>Trace the events. Read the competing accounts.<br>Follow the human consequences beyond the border.</p><div class="hero-actions"><button class="btn primary" data-nav="atlas">Explore the district atlas <span>&#8599;</span></button><button class="btn ghost" data-nav="register">Open the source register &#8594;</button></div><div class="hero-ledger"><span><b>${SOURCES.length}</b> source records</span><span><b>${EVENTS.length}</b> dated entries</span><span><b>${DATA.videos.length}</b> video / audio links</span></div><div class="hero-edition">OBSIDIAN EDITION <i></i> PUBLIC-SOURCE SNAPSHOT / 12 OCT 2026</div></div>${researchDial()}</section><div class="edition-strip"><span>NEW IN THIS EDITION</span><p>District dossiers expanded &middot; Northeast consequences &middot; International lens &middot; Video library &middot; Publication-grouped register</p><button data-nav="method">Coverage audit &#8599;</button></div>`+body;}
function bridgeFlow(labels,caption){return `<div class="bridge-flow" role="img" aria-label="${esc(labels.join(' then '))}. ${esc(caption)}">${labels.map((t,i)=>`<div class="bridge-node"><span>0${i+1}</span><strong>${esc(t)}</strong></div>${i<labels.length-1?'<div class="bridge-arrow" aria-hidden="true"><i></i><b>&#8594;</b></div>':''}`).join('')}</div><p class="flow-caption">${esc(caption)}</p>`;}
function causes(){return intro('Cause cycle / internal and external context','Where escalation begins.','Separate internal drivers from external pressures and feedback. Geography is not guilt: a refugee flow, a regional affiliation or an international report is not proof of responsibility.')+tabs([['internal','01 / Internal to Manipur'],['external','02 / External context']],EXTRA.causeScope,'data-cause-scope')+`<div id="causeScopeBody">${EXTRA.causeScope==='internal'?causesInternal().replace(/<section class="page-intro">[\s\S]*?<\/section>/,''):externalCauses()}</div>`;}
function externalCauses(){let scope=EXTRA.externalScope;
const views={
 northeast:{title:'The wider Northeast: links, pressures and feedback',caption:'These mechanisms describe regional context and potential feedback, not a finding that neighbouring states caused the violence.',flow:['Cross-state social ties','Movement & corridor pressure','Regional public response','Feedback into local trust'],items:[
 {label:'MIZORAM / ASSAM',title:'Kinship, shelter and regional mobilisation',text:'Movement into neighbouring states and community support connect the crisis to a wider public. Hosting and humanitarian solidarity must not be recast as evidence of armed participation.',keys:['mizoram','assam','assamvoices'],qualifier:'Documented movement; the feedback mechanism is analytical.'},
 {label:'NAGALAND / ASSAM',title:'Roads and access beyond district borders',text:'Camp reporting, stranded trucks and evacuation operations show why cross-state routes matter. Road disruption can compound local shortages; its cause must be established episode by episode.',keys:['senapati','noneyroad','nagaland'],qualifier:'Differentiate blockades, security restrictions and landslides.'},
 {label:'REGIONAL INFORMATION',title:'Fear can travel farther than the incident',text:'A reported clash in Shillong and coordinated student evacuations illustrate concern beyond Manipur. They do not establish sustained ethnic fighting throughout the Northeast.',keys:['shillong','meghalaya','arunachal'],qualifier:'These are consequences and possible feedback, not initial triggers.'}
 ]},
 india:{title:'The rest of India: institutions, politics and information',caption:'Institutional decisions can shape risk, response and public trust. The arrows are an analytical reading, not a measured causal apportionment.',flow:['Centre-state decisions','Security & legal response','National public debate','Trust & accountability'],items:[
 {label:'UNION / STATE',title:'Protection and institutional responsibility',text:'Read government explanations alongside judicial supervision and documented criticism. A policy explanation is distinct from proof that a particular person committed or ordered an attack.',ids:['S10','S18','S21','S23'],qualifier:'The underlying primary record controls the claim.'},
 {label:'PARLIAMENT / PARTIES',title:'Competing accounts of normalisation',text:'Parliamentary statements, opposition questions and fact-checks use different dates and meanings of normalcy. Compare the same period and measure before calling a response a rebuttal.',ids:['S24','S109','S111',sid('quintshah')],qualifier:'Political disagreement is not itself a demonstrated cause of violence.'},
 {label:'INFORMATION SYSTEMS',title:'Restrictions, reporting and misinformation',text:'Shutdown monitoring and investigations of specific false claims identify information constraints. Both the government rationale and effects on civilian access require careful attribution.',ids:['S68','S76','S77',sid('accessnow'),sid('accessnow2024')],qualifier:'Digital rights reports document their own methodology, not population-wide causal effects.'}
 ]},
 international:{title:'Across the border: Myanmar and the international lens',caption:'Cross-border pressures and diplomatic attention sit at different points in the cycle. International coverage is usually a response to violence, not evidence of its origin.',flow:['Myanmar instability','Border policy & movements','Competing security claims','Diplomacy & external scrutiny'],items:[
 {label:'MYANMAR / BORDER',title:'Displacement, armed activity and border policy',text:'Conflict analysis places Manipur beside instability in Myanmar. Claims about migration, weapons or cross-border groups remain actor-specific allegations unless independently corroborated.',ids:['S56','S23',sid('diplomat'),sid('foreignpolicy')],qualifier:'No collective responsibility is assigned to refugees or an ethnic community.'},
 {label:'INTERNATIONAL RESPONSE',title:'Scrutiny and the government response',text:'UN experts, the European Parliament and rights organisations have raised concerns. India has challenged some external assessments. Preserve their different mandates and the actual reply.',ids:['S52','S53','S54','S55','S33'],qualifier:'These interventions are responses and diplomatic context, not demonstrated triggers.'},
 {label:'ECONOMIC INSTITUTIONS',title:'Do not manufacture a World Bank or IMF conflict diagnosis',text:'Located World Bank material is survey metadata; the IMF item is national macroeconomic background. Neither supplies an attributable causal finding or a Manipur-specific loss estimate here.',keys:['worldbank','imf'],qualifier:'Background only. No conflict-specific assessment located in this research pass.'}
 ]}
};const d=views[scope];return tabs([['northeast','Other Northeast states'],['india','Rest of India'],['international','International / cross-border']],scope,'data-external-scope')+`<section class="panel panel-pad"><div class="eyebrow">EXTERNAL CONTEXT / ${esc(scope)}</div><h2>${d.title}</h2>${bridgeFlow(d.flow,d.caption)}</section>${sectionTitle('Mechanisms and evidence')}${keyCards(d.items)}<div class="note warning section-gap">External context is not the same as external culpability. No statistical percentage of the conflict is assigned to any state, country, organisation or community.</div>`;}
function consequences(){return intro('Consequence cycle / Manipur and the wider Northeast','The impact does not stop at a border.','Keep direct harm, displacement, evacuation, service pressure and reported security trends in separate categories. A person evacuated from danger is not automatically a victim of a physical attack.')+tabs([['manipur','01 / Within Manipur'],['northeast','02 / The whole Northeast']],EXTRA.impactScope,'data-impact-scope')+(EXTRA.impactScope==='manipur'?consequencesInternal().replace(/<section class="page-intro">[\s\S]*?<\/section>/,'')+localImpactSupplement():regionalImpact());}
const REGION_IMPACTS=[
 {name:'Manipur',type:'Direct harm and prolonged displacement',period:'Multiple cutoffs, 2023-2026',text:'The direct conflict record includes deaths, injury, displacement, interrupted care, education, movement and unresolved accountability. Measures are dated separately.',ids:['S01','S11','S25','S44'],limit:'Do not add camp deaths from all causes to reported conflict fatalities.'},
 {name:'Assam',type:'Cross-state shelter and border response',period:'June 2024',text:'Cachar police reported around 600 arrivals from Jiribam on 10 June. Reporting also follows families seeking shelter and the administrative response.',keys:['assam','assamvoices','cacharresponse'],limit:'A point-in-time arrival estimate, not the present displaced population.'},
 {name:'Mizoram',type:'Hosting, aid and supply corridors',period:'June 2023 / July 2025',text:'Reporting documents shelter, school admissions and pressure on relief resources, alongside the government response. Later reporting describes changes to an emergency food-supply route.',keys:['mizoram','rice','mizoramstrain'],limit:'Separate Manipur displacement from arrivals caused by the Myanmar conflict.'},
 {name:'Nagaland',type:'Evacuation and return',period:'10 May 2023',text:'The state information department reported 1,229 returnees evacuated in two phases. Reporting links the operation to women workers from Thoubal as well as other returnees.',keys:['nagaland','nagaworkers'],limit:'Operational returnee counts are not counts of deaths, injuries or permanent displacement.'},
 {name:'Meghalaya',type:'Student assistance and a reported local clash',period:'4-5 May 2023',text:'Reporting describes assistance for people in Manipur and a Shillong altercation followed by police action. This is not evidence of a statewide outbreak in Meghalaya.',keys:['shillong','meghalaya','campus'],limit:'Use the incident-specific police account. Do not generalise the behaviour of students or communities.'},
 {name:'Arunachal Pradesh',type:'Evacuation coordination',period:'5-6 May 2023',text:'Regional reporting records government efforts to assist residents stranded in Manipur and the initial phase of returns.',keys:['arunachal'],limit:'The number stranded and the number already returned are different operational figures.'},
 {name:'Sikkim',type:'Student evacuation',period:'7-8 May 2023',text:'Reporting describes rescued students returning in batches. The video library includes an ANI report of one batch, separate from the aggregate reported in another article.',keys:['sikkim','sikkimvideo'],limit:'Do not add the video batch to an overlapping aggregate.'},
 {name:'Tripura',type:'Student evacuation',period:'8 May 2023',text:'PTI reporting describes the final returning student batch and a total of 239 airlifted students across the operation.',keys:['tripura'],limit:'Evacuation is a protective response, not evidence that violence occurred in Tripura.'}
];
function regionalImpact(){return `<section class="panel panel-pad"><div class="eyebrow">REGIONAL CONSEQUENCE PATHWAY</div><h2>One crisis. Different regional effects.</h2>${bridgeFlow(['Violence & insecurity','People and routes disrupted','Hosting & evacuation','Care, continuity & return'],'Documented effects differ by state. Service-pressure links are analytical unless the cited report measures them.')}</section><div class="grid grid-2 section-gap"><section class="panel">${panelHead('Reported security series / 2023','Manipur within the Northeast total','PTI reporting of the Ministry of Home Affairs annual report.')}${chartDonut([{label:'Manipur',value:187,color:'#c7af7e'},{label:'Other Northeast states',value:56,color:'#72969f'}],'243','REPORTED INCIDENTS')}<div class="panel-foot"><span>This specific reported security series is not a census of all ethnic violence, crimes, protests or fatalities.</span>${citeKeys(['mha'])}</div></section><section class="panel">${panelHead('Registered violent crime / NCRB','An exceptional change in the registered series','Figures reported for Manipur; a different denominator from the adjacent chart.')}<div class="measured-bars">${[[2021,545],[2022,631],[2023,14427]].map(([year,n])=>`<div class="measured-bar"><span>${year}</span><div><i style="width:${n/14427*100}%"></i></div><b>${fmt(n)}</b></div>`).join('')}</div><div class="panel-foot"><span>Zero-based bars. Registered crimes are not unique ethnic incidents or a conflict death toll. Reported by PTI / NDTV, September 2025.</span>${citeKeys(['ncrb'])}</div></section></div>${sectionTitle('The eight-state view','State-specific evidence, not a regional severity ranking.')}<div class="grid grid-2">${REGION_IMPACTS.map((x,i)=>`<article class="region-impact"><div class="region-index">${String(i+1).padStart(2,'0')}<span>${esc(x.period)}</span></div><h3>${x.name}</h3><h4>${x.type}</h4><p>${x.text}</p>${refs(x.ids||x.keys.map(sid))}<div class="qualification">${x.limit}</div></article>`).join('')}</div><div class="note section-gap">This collection does not establish representative regional income losses, school-dropout rates, mental-health prevalence or public opinion. Those require separate, comparable data rather than percentages inferred from news coverage.</div>`;}
function internationalSet(){return SOURCES.filter(s=>/international|economic background/i.test(s.category)||['S33','S34','S35','S36','S37','S38','S41','S42','S44','S52','S53','S54','S55','S56','S57','S58'].includes(s.id));}
function international(){return intro('The international lens / institutions and publications','Beyond the national news cycle.','Read foreign reporting, magazines, rights monitoring and institutional responses without treating every publication as an independent investigation or every institution as a court.')+`<div class="grid grid-3"><article class="feature-card"><div class="feature-number">DIPLOMACY & RIGHTS</div><h3>Statements and documented replies</h3><p>UN expert concerns and European Parliament action are paired with the recorded Indian responses. Advocacy findings and diplomatic positions retain their attribution.</p>${refs(['S52','S53','S54','S55'])}</article><article class="feature-card"><div class="feature-number">WORLD BANK</div><h3>Survey metadata, not a violence assessment</h3><p>The located regional survey coding is an economic-data lead. It cannot establish Manipur-specific conflict losses or allocate causation.</p>${citeKeys(['worldbank'])}</article><article class="feature-card"><div class="feature-number">INTERNATIONAL MONETARY FUND</div><h3>National context, not a state-level finding</h3><p>The located Article IV material concerns India-wide macroeconomics. No conflict-specific IMF conclusion is asserted.</p>${citeKeys(['imf'])}</article></div><div class="section-gap">${tabs([['all','All international records'],['reporting','Media & magazines'],['institutions','Institutions & responses'],['background','Economic background']],EXTRA.international,'data-international')}</div><div id="internationalResults"></div>`;}
function renderInternational(){const mode=EXTRA.international;let a=internationalSet();if(mode==='reporting')a=a.filter(s=>/report|magazine|investigation|testimony|video/i.test(s.category)&&!/institution|economic/i.test(s.category));if(mode==='institutions')a=a.filter(s=>!(/report|magazine|video/i.test(s.category))&&!/economic background/i.test(s.category));if(mode==='background')a=a.filter(s=>/economic background/i.test(s.category));$('internationalResults').innerHTML=`<div class="collection-line"><span>${a.length} source records</span><p>Review depth and date are shown in each record. Related articles can share the same underlying source.</p></div>${sourceCards(a.sort((a,b)=>a.publisher.localeCompare(b.publisher)||a.title.localeCompare(b.title)))}`;}
function videos(){return intro('Video library / social platforms / long-form audio','Watch the record. Keep the context.','Individual items open on the publisher or platform website. Video descriptions and metadata have been reviewed where available; full playback, transcription and clip-level authentication have not been completed.')+`<div class="media-summary"><span><b>${DATA.videos.length}</b> individual video / audio links</span><span><b>${DATA.channels.length}</b> separate discovery launchers</span><span>No autoplay &middot; No hidden embeds</span></div><div class="toolbar"><input id="videoSearch" value="${esc(EXTRA.video.q)}" placeholder="Find a speaker, publisher, platform or issue..." aria-label="Search video library"><select id="videoPlatform" aria-label="Filter by video platform">${options(uniq(DATA.videos.map(x=>x.platform)).sort(),EXTRA.video.platform,'All platforms')}</select><select id="videoKind" aria-label="Filter by media type">${options(uniq(DATA.videos.map(x=>x.kind)).sort(),EXTRA.video.kind,'All media types')}</select><button class="btn small" data-extra-action="video-reset">Reset</button></div><div id="videoResults"></div>${sectionTitle('Continue discovery on the platforms','Search launchers are not evidence records and are excluded from the item count.')}<div class="grid grid-2">${DATA.channels.map(x=>`<article class="channel-card"><div class="channel-icon">${esc(x.platform.slice(0,2).toUpperCase())}</div><div><h3>${esc(x.platform)}</h3><p>${esc(x.note)}</p><a class="mini-link" href="${esc(safeURL(x.url))}" target="_blank" rel="noopener noreferrer">Open platform search &#8599;</a></div></article>`).join('')}</div><div class="note warning section-gap"><strong>Instagram coverage is a remaining gap:</strong> no individual reel was authenticated in this edition. The Instagram launcher is visibly marked as discovery. X and Facebook links may require login; opening a website rather than an app is controlled by the platform and your device.</div>`;}
function filteredVideos(){const f=EXTRA.video,q=f.q.toLowerCase().trim();return DATA.videos.filter(v=>(!f.platform||v.platform===f.platform)&&(!f.kind||v.kind===f.kind)&&(!q||[v.id,v.title,v.publisher,v.platform,v.summary,v.topic].join(' ').toLowerCase().includes(q)));}
function renderVideos(){const a=filteredVideos();$('videoResults').innerHTML=`<div class="collection-line"><span>${a.length} matching items</span><p>Publication dates may differ from speech or incident dates.</p></div>${a.length?`<div class="grid grid-3">${a.map((v,i)=>`<article class="video-card"><a class="video-cover" href="${esc(safeURL(v.url))}" target="_blank" rel="noopener noreferrer" aria-label="Open ${esc(v.title)}"><div class="video-lines" aria-hidden="true"></div><span class="video-platform">${esc(v.platform)}</span><span class="play-disc" aria-hidden="true">${v.kind==='Podcast'?'&#9835;':'&#9655;'}</span><span class="video-id">${v.id} / ${esc(v.kind)}</span>${v.duration?`<span class="video-duration">${esc(v.duration)}</span>`:''}</a><div class="video-body"><div class="publisher">${esc(v.publisher)} &middot; ${esc(dateLabel(v.date))}</div><h3>${esc(v.title)}</h3><p>${esc(v.summary)}</p><div class="qualification">${esc(v.review)}</div><div class="video-actions"><a class="btn small" href="${esc(safeURL(v.url))}" target="_blank" rel="noopener noreferrer">Open ${v.kind==='Podcast'?'audio':'video'} &#8599;</a><button class="mini-link" data-source="${v.source}">Evidence & context</button></div></div></article>`).join('')}</div>`:empty('No media items match','Clear a filter or use the separate discovery launchers below.')}`;}
function register(){return intro('Source register / category then publication','The research desk, in rows.','An independent table of the complete source collection. Category comes first, publication second, title third. Dates remain visible for context but do not determine the grouping.')+`<div class="toolbar"><input id="registerSearch" value="${esc(EXTRA.register.q)}" placeholder="Search titles, publishers, districts, notes or source IDs..." aria-label="Search source register"><select id="registerCategory" aria-label="Register category">${options(uniq(SOURCES.map(s=>s.category)).sort(),EXTRA.register.category,'All categories')}</select><select id="registerPublisher" aria-label="Register publication">${options(uniq(SOURCES.map(s=>s.publisher)).sort(),EXTRA.register.publisher,'All publications')}</select><button class="btn small" data-extra-action="register-reset">Reset</button><button class="btn small primary" data-extra-action="register-csv">Export this table</button></div><div id="registerResults"></div>`;}
function registerRows(){const f=EXTRA.register,q=f.q.toLowerCase().trim();return SOURCES.filter(s=>(!f.category||s.category===f.category)&&(!f.publisher||s.publisher===f.publisher)&&(!q||[s.id,s.title,s.publisher,s.category,s.summary,s.note,s.topic,...s.districts,...s.tags].join(' ').toLowerCase().includes(q))).sort((a,b)=>a.category.localeCompare(b.category)||a.publisher.localeCompare(b.publisher)||a.title.localeCompare(b.title));}
function renderRegister(){const a=registerRows();let category='',pub='',rows='';for(const s of a){if(s.category!==category){category=s.category;pub='';rows+=`<tr class="register-category"><th colspan="7" scope="colgroup"><span>${esc(category)}</span><small>${a.filter(x=>x.category===category).length} records</small></th></tr>`;}if(s.publisher!==pub){pub=s.publisher;rows+=`<tr class="register-publication"><th colspan="7" scope="colgroup">${esc(pub)}</th></tr>`;}rows+=`<tr class="register-entry"><td class="register-id"><button data-source="${s.id}">${s.id} &#8599;</button>${s.editionAdded?'<span class="new-marker">NEW</span>':''}</td><td class="register-title"><details><summary>${esc(s.title)}</summary><p>${esc(s.summary)}</p><p class="fine">${esc(s.note)}</p></details></td><td>${esc(s.topic)}</td><td>${esc(s.districts.length?s.districts.join(', '):'Statewide / context')}</td><td>${esc(s.review)}<small>${esc(s.medium)}</small></td><td>${esc(dateLabel(s.date))}</td><td><a class="table-original" href="${esc(safeURL(s.url))}" target="_blank" rel="noopener noreferrer" aria-label="Open original source for ${s.id}">Original &#8599;</a></td></tr>`;}
$('registerResults').innerHTML=`<div class="collection-line"><span>${a.length} records / ${uniq(a.map(s=>s.publisher)).length} publications / ${uniq(a.map(s=>s.category)).length} categories</span><p>Expand a title for its summary and limitations.</p></div>${a.length?`<div class="panel table-wrap register-wrap"><table class="register-table"><caption class="sr-only">Source records grouped by category, then publication, then title.</caption><thead><tr><th>ID</th><th>Title and context</th><th>Issue</th><th>Geography</th><th>Review depth</th><th>Published</th><th>Source</th></tr></thead><tbody>${rows}</tbody></table></div>`:empty('No source records match','Reset the filters to view the complete register.')}`;}
function exportRegister(){const cols=['category','publisher','id','title','date','topic','districts','review','medium','summary','note','url'];const cell=v=>{let t=String(Array.isArray(v)?v.join('; '):v??'');if(/^[=+@-]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';};const a=registerRows();exportFile('\ufeff'+[cols.join(','),...a.map(s=>cols.map(k=>cell(s[k])).join(','))].join('\r\n'),`Manipur_Obsidian_Register_${a.length}.csv`,'text/csv;charset=utf-8');}
// Progressive motion enhancement: content remains visible without animation support.
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
let motionPaused=reducedMotion.matches;
try{const choice=localStorage.getItem('manipur-motion-paused');if(choice!==null)motionPaused=choice==='true'||reducedMotion.matches;}catch{}
let revealObserver=null;
function applyMotion(){document.body.classList.toggle('motion-paused',motionPaused);const b=$('motionToggle');if(b){b.textContent=motionPaused?'Motion off':'Pause motion';b.setAttribute('aria-pressed',String(motionPaused));b.title=motionPaused?'Enable motion (system reduced-motion preferences still apply)':'Pause continuous motion';}if(motionPaused)document.querySelectorAll('.reveal').forEach(x=>x.classList.add('revealed'));}
function animateHeadings(root=$('workspace')){if(revealObserver)revealObserver.disconnect();const items=[...root.querySelectorAll('h1,h2,h3')];items.forEach((h,i)=>{h.classList.add('reveal');h.style.setProperty('--reveal-delay',`${Math.min(i%4,3)*55}ms`);if(motionPaused||reducedMotion.matches)h.classList.add('revealed');});if(!('IntersectionObserver' in window)){items.forEach(h=>h.classList.add('revealed'));return;}revealObserver=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('revealed');revealObserver.unobserve(e.target);}}),{threshold:.08});items.forEach(h=>revealObserver.observe(h));}
function replaceScope(){const y=scrollY;$('workspace').innerHTML=state.tab==='causes'?causes():consequences();animateHeadings();window.scrollTo({top:y,behavior:'instant'});}
document.addEventListener('click',e=>{const b=e.target.closest('[data-cause-scope],[data-external-scope],[data-impact-scope],[data-international],[data-extra-action]');if(!b)return;if(b.dataset.causeScope){EXTRA.causeScope=b.dataset.causeScope;replaceScope();}if(b.dataset.externalScope){EXTRA.externalScope=b.dataset.externalScope;replaceScope();}if(b.dataset.impactScope){EXTRA.impactScope=b.dataset.impactScope;replaceScope();}if(b.dataset.international){EXTRA.international=b.dataset.international;document.querySelectorAll('[data-international]').forEach(x=>{x.classList.toggle('active',x.dataset.international===EXTRA.international);x.setAttribute('aria-pressed',String(x.dataset.international===EXTRA.international));});renderInternational();}switch(b.dataset.extraAction){case 'register-reset':EXTRA.register={q:'',category:'',publisher:''};route();break;case 'video-reset':EXTRA.video={q:'',platform:'',kind:''};route();break;case 'register-csv':exportRegister();break;}});
document.addEventListener('input',e=>{if(e.target.id==='registerSearch'){EXTRA.register.q=e.target.value;renderRegister();}if(e.target.id==='videoSearch'){EXTRA.video.q=e.target.value;renderVideos();}});
document.addEventListener('change',e=>{const id=e.target.id,v=e.target.value;if(id==='registerCategory'||id==='registerPublisher'){EXTRA.register[id==='registerCategory'?'category':'publisher']=v;renderRegister();}if(id==='videoPlatform'||id==='videoKind'){EXTRA.video[id==='videoPlatform'?'platform':'kind']=v;renderVideos();}});
$('motionToggle').addEventListener('click',()=>{motionPaused=!motionPaused;try{localStorage.setItem('manipur-motion-paused',String(motionPaused));}catch{}applyMotion();});
reducedMotion.addEventListener?.('change',e=>{if(e.matches){motionPaused=true;applyMotion();}});
applyMotion();

function localImpactSupplement(){return sectionTitle('Two measured service snapshots','Historical administrative reporting; not current conditions.')+`<div class="grid grid-2"><section class="panel">${panelHead('Banking access / 11 June 2023','Branches reported operational','PTI reporting of a government relief briefing.')}${chartDonut([{label:'Reported operational',value:198,color:'#cfb584'},{label:'Not reported operational',value:44,color:'#617f8b'}],'242','BANK BRANCHES')}<div class="panel-foot"><span>Derived remainder: 242 minus 198. This is service availability at one date, not an economic-loss estimate.</span>${citeKeys(['banking'])}</div></section><section class="panel">${panelHead('Children / September 2023','Documented needs, not a prevalence survey')}<div class="panel-pad"><div class="key-stat"><div><h4>Children recorded in relief camps</h4><p>Reported state social-welfare data</p></div><strong>12,694</strong></div><div class="key-stat"><div><h4>Identified as needing professional counselling</h4><p>Reported severe-trauma category</p></div><strong>100</strong></div><p class="fine section-gap">The second number does not establish that all other children were unaffected. No trauma-prevalence percentage is calculated.</p>${citeKeys(['children'])}</div></section></div><div class="editor-note section-gap"><strong>A discrepancy that must stay visible.</strong> June 2026 RTI reporting records 731 deaths among camp and prefabricated-housing residents across nine districts. The September court record reports 640 across eight districts. The figures have different scopes and have not been reconciled here; they are not an increasing or decreasing trend, and neither is a conflict-killing total.${refs([sid('campRTI'),'S11'])}</div>`;}


document.addEventListener('click',e=>{const b=e.target.closest('[data-nav],[data-source],[data-save],[data-district],[data-event],[data-action],[data-flow],[data-report],[data-civil],[data-copy],[data-global-source]');if(!b)return;
 if(b.dataset.nav){navTo(b.dataset.nav);return;}
 if(b.dataset.source){openSource(b.dataset.source);return;}
 if(b.dataset.globalSource){$('searchDialog').close();openSource(b.dataset.globalSource);return;}
 if(b.dataset.save){saveSource(b.dataset.save);return;}
 if(b.dataset.district){if($('sourceDialog').open)$('sourceDialog').close();openDistrict(b.dataset.district);return;}
 if(b.dataset.event){openEvent(b.dataset.event);return;}
 if(b.dataset.copy){const s=BYID[b.dataset.copy];copyText(`${s.id} | ${s.publisher}. ${s.title}. ${dateLabel(s.date)}. ${s.url} (research access: 12 October 2026; ${s.review}).`);return;}
 if(b.dataset.flow){const mode=b.dataset.flow;state[mode==='causes'?'causeNode':'consequenceNode']=Number(b.dataset.index);$(mode==='causes'?'causeFlow':'consequenceFlow').innerHTML=flowDiagram(mode);return;}
 if(b.dataset.report){state.reportMode=b.dataset.report;document.querySelectorAll('[data-report]').forEach(x=>x.classList.toggle('active',x.dataset.report===state.reportMode));renderVoices();return;}
 if(b.dataset.civil){state.civilMode=b.dataset.civil;document.querySelectorAll('[data-civil]').forEach(x=>x.classList.toggle('active',x.dataset.civil===state.civilMode));renderCivil();return;}
 switch(b.dataset.action){case 'close-source':$('sourceDialog').close();break;case 'close-search':$('searchDialog').close();break;case 'close-drawer':closeDrawer();break;case 'saved':state.library={q:'',category:'',year:'',district:'',topic:'',saved:true};navTo('library');break;case 'method':navTo('method');break;case 'library':navTo('library');break;case 'atlas-reset':state.atlas={year:'',topic:'',kind:''};route();break;case 'lib-reset':state.library={q:'',category:'',year:'',district:'',topic:'',saved:false};route();break;case 'lib-saved':state.library.saved=!state.library.saved;b.classList.toggle('primary',state.library.saved);b.innerHTML=state.library.saved?'\u2605 Saved only':'\u2606 Saved only';renderLibraryResults();break;case 'csv':exportCSV();break;case 'json':exportJSON();break;case 'print':window.print();break;case 'district-library':state.library={q:'',category:'',year:state.districtYear,district:state.district,topic:state.districtTopic,saved:false};navTo('library');break;}
});
document.addEventListener('input',e=>{if(e.target.id==='globalSearch')renderGlobal(e.target.value);if(e.target.id==='libSearch'){state.library.q=e.target.value;renderLibraryResults();}if(e.target.id==='claimSearch'){state.claimQuery=e.target.value;renderClaims();}});
document.addEventListener('change',e=>{let id=e.target.id,v=e.target.value;const lf={libCategory:'category',libYear:'year',libDistrict:'district',libTopic:'topic'};if(lf[id]){state.library[lf[id]]=v;renderLibraryResults();}const af={atlasYear:'year',atlasTopic:'topic',atlasKind:'kind'};if(af[id]){state.atlas[af[id]]=v;renderAtlasBody();}if(id==='claimYear'){state.claimYear=v;renderClaims();}if(['districtYear','districtTopic','districtType'].includes(id)){state[id]=id==='districtType'?(v||'all'):v;renderDistrict();$(id)?.focus();}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('svg [role="button"]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)&&!$('sourceDialog').open&&!$('searchDialog').open){e.preventDefault();openSearch();}if(e.key==='Escape'&&!$('sourceDialog').open&&!$('searchDialog').open)closeDrawer();if(e.key==='Tab'&&!$('drawer').hidden&&!$('sourceDialog').open){const f=[...$('drawer').querySelectorAll('button,a,select,input,[tabindex="0"]')].filter(x=>!x.disabled);if(f.length){if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus();}if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus();}}}});
$('searchTrigger').addEventListener('click',openSearch);$('veil').addEventListener('click',closeDrawer);$('menuToggle').addEventListener('click',()=>document.querySelector('.rail').classList.toggle('open'));
window.addEventListener('hashchange',route);
$('savedCount').textContent=saved.size;
route();
window.MANIPUR_TEST={sourceCount:SOURCES.length,eventCount:EVENTS.length,claimCount:CLAIMS.length,districtCount:DISTRICTS.length,videoCount:DATA.videos.length,quoteCount:DATA.quotes.length,state,extra:EXTRA};
</script>
